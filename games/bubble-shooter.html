<style>

<body>

  <div id="menuOverlay">
    <h1>BUBBLE SHOOTER</h1>
    <p>Select Your Difficulty</p>
    <div class="difficulty-buttons">
      <button class="easy" onclick="startGame('easy')">Easy</button>
      <button class="normal" onclick="startGame('normal')">Normal</button>
      <button class="hard" onclick="startGame('hard')">Hard</button>
    </div>
  </div>

  <canvas id="gameCanvas" width="480" height="720"></canvas>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const menuOverlay = document.getElementById("menuOverlay");

  let gameRunning = false;
  let score = 0;
  let difficulty = 'normal';
  
  const BUBBLE_RADIUS = 18;
  const BUBBLE_DIAMETER = BUBBLE_RADIUS * 2;
  const COLS = 12;
  const ROWS = 16;
  
  const COLORS = ["#ef4444", "#3b82f6", "#10b981", "#f59e0b", "#8b5cf6", "#ec4899"];
  let activeColors = [];

  let grid = [];
  let shooter = { x: canvas.width / 2, y: canvas.height - 50, angle: 0 };
  let currentBubble = null;
  let nextBubble = null;
  let projectile = null;
  let fallingBubbles = []; // NEW: Array for falling animations
  let shootSpeed = 14;
  let rowsToFill = 6;

  function startGame(diff) {
    difficulty = diff;
    menuOverlay.style.display = "none";
    gameRunning = true;
    score = 0;
    
    if (difficulty === 'easy') {
      activeColors = COLORS.slice(0, 4); 
      rowsToFill = 5;
      shootSpeed = 12;
    } else if (difficulty === 'normal') {
      activeColors = COLORS.slice(0, 5);
      rowsToFill = 7;
      shootSpeed = 14;
    } else {
      activeColors = COLORS; 
      rowsToFill = 9;
      shootSpeed = 16;
    }

    resetGame();
  }

  function resetGame() {
    grid = [];
    fallingBubbles = []; // Reset falling bubbles
    
    for (let r = 0; r < ROWS; r++) {
      grid[r] = [];
      for (let c = 0; c < COLS; c++) {
        if (r < rowsToFill) {
          grid[r][c] = {
            color: activeColors[Math.floor(Math.random() * activeColors.length)],
            x: c * BUBBLE_DIAMETER + BUBBLE_RADIUS + (r % 2 === 0 ? 0 : BUBBLE_RADIUS) + 10,
            y: r * BUBBLE_DIAMETER * 0.87 + BUBBLE_RADIUS + 10
          };
        } else {
          grid[r][c] = null;
        }
      }
    }
    
    currentBubble = createRandomBubble();
    nextBubble = createRandomBubble();
    projectile = null;
    
    gameLoop();
  }

  function createRandomBubble() {
    return { color: activeColors[Math.floor(Math.random() * activeColors.length)] };
  }

  function drawBubble(x, y, color, isProjectile = false) {
    ctx.beginPath();
    ctx.arc(x, y, BUBBLE_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    
    ctx.strokeStyle = "rgba(0,0,0,0.1)";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(x - 5, y - 5, BUBBLE_RADIUS / 3, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.fill();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Grid
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (grid[r][c]) {
          drawBubble(grid[r][c].x, grid[r][c].y, grid[r][c].color);
        }
      }
    }

    // Draw Falling Bubbles
    fallingBubbles.forEach(b => {
      drawBubble(b.x, b.y, b.color);
    });

    // Draw Aim Line
    if (gameRunning && !projectile) {
      ctx.beginPath();
      ctx.moveTo(shooter.x, shooter.y);
      let endX = shooter.x + Math.cos(shooter.angle) * 200;
      let endY = shooter.y + Math.sin(shooter.angle) * 200;
      ctx.lineTo(endX, endY);
      ctx.strokeStyle = "rgba(0,0,0,0.2)";
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 8]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Draw Shooter Base
    ctx.beginPath();
    ctx.arc(shooter.x, shooter.y, 35, 0, Math.PI * 2);
    ctx.fillStyle = "#e2e8f0";
    ctx.fill();
    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 4;
    ctx.stroke();

    // Draw Current Bubble
    if (currentBubble) {
      drawBubble(shooter.x, shooter.y, currentBubble.color);
    }

    // Draw Next Bubble
    if (nextBubble) {
      drawBubble(50, canvas.height - 50, nextBubble.color);
      ctx.fillStyle = "#64748b";
      ctx.font = "bold 14px Poppins";
      ctx.textAlign = "center";
      ctx.fillText("NEXT", 50, canvas.height - 90);
    }

    // Draw Projectile
    if (projectile) {
      drawBubble(projectile.x, projectile.y, projectile.color, true);
    }

    // Draw Score
    ctx.fillStyle = "#1e293b";
    ctx.font = "bold 24px Poppins";
    ctx.textAlign = "right";
    ctx.fillText("Score: " + score, canvas.width - 20, 40);
  }

  function update() {
    if (!gameRunning) return;

    // Update falling bubbles (Gravity)
    for (let i = fallingBubbles.length - 1; i >= 0; i--) {
      let b = fallingBubbles[i];
      b.vy += 0.8; // Gravity acceleration
      b.y += b.vy;
      
      // Remove if off-screen
      if (b.y > canvas.height + BUBBLE_RADIUS) {
        fallingBubbles.splice(i, 1);
      }
    }

    if (!projectile) return;

    projectile.x += Math.cos(projectile.angle) * shootSpeed;
    projectile.y += Math.sin(projectile.angle) * shootSpeed;

    if (projectile.x < BUBBLE_RADIUS + 10) {
      projectile.x = BUBBLE_RADIUS + 10;
      projectile.angle = Math.PI - projectile.angle;
    }
    if (projectile.x > canvas.width - BUBBLE_RADIUS - 10) {
      projectile.x = canvas.width - BUBBLE_RADIUS - 10;
      projectile.angle = Math.PI - projectile.angle;
    }

    if (projectile.y < BUBBLE_RADIUS + 10) {
      snapBubble();
      return;
    }

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (grid[r][c]) {
          let dist = Math.hypot(projectile.x - grid[r][c].x, projectile.y - grid[r][c].y);
          if (dist < BUBBLE_DIAMETER - 4) {
            snapBubble();
            return;
          }
        }
      }
    }
  }

  function snapBubble() {
    let closestR = 0, closestC = 0, minDist = Infinity;
    
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (!grid[r][c]) {
          let expectedX = c * BUBBLE_DIAMETER + BUBBLE_RADIUS + (r % 2 === 0 ? 0 : BUBBLE_RADIUS) + 10;
          let expectedY = r * BUBBLE_DIAMETER * 0.87 + BUBBLE_RADIUS + 10;
          let dist = Math.hypot(projectile.x - expectedX, projectile.y - expectedY);
          if (dist < minDist) {
            minDist = dist;
            closestR = r;
            closestC = c;
          }
        }
      }
    }

    let snapX = closestC * BUBBLE_DIAMETER + BUBBLE_RADIUS + (closestR % 2 === 0 ? 0 : BUBBLE_RADIUS) + 10;
    let snapY = closestR * BUBBLE_DIAMETER * 0.87 + BUBBLE_RADIUS + 10;
    
    grid[closestR][closestC] = { color: projectile.color, x: snapX, y: snapY };

    projectile = null;
    checkMatches(closestR, closestC);
    
    currentBubble = nextBubble;
    nextBubble = createRandomBubble();
  }

  // NEW LOGIC: Check Matches and Drop Floating Bubbles
  function checkMatches(r, c) {
    let targetColor = grid[r][c].color;
    let matches = [];
    let visited = new Set();

    function dfs(row, col) {
      if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;
      if (!grid[row][col] || grid[row][col].color !== targetColor) return;
      
      let key = row + "," + col;
      if (visited.has(key)) return;
      
      visited.add(key);
      matches.push({r: row, c: col});

      let isEven = row % 2 === 0;
      dfs(row - 1, col + (isEven ? -1 : 0));
      dfs(row - 1, col + (isEven ? 0 : 1));
      dfs(row, col - 1);
      dfs(row, col + 1);
      dfs(row + 1, col + (isEven ? -1 : 0));
      dfs(row + 1, col + (isEven ? 0 : 1));
    }

    dfs(r, c);

    if (matches.length >= 3) {
      // Remove matches
      matches.forEach(m => {
        let bubble = grid[m.r][m.c];
        if (bubble) {
          fallingBubbles.push({ x: bubble.x, y: bubble.y, color: bubble.color, vy: 2 });
          grid[m.r][m.c] = null;
          score += 10;
        }
      });

      // Now check for floating (disconnected) bubbles
      dropFloatingBubbles();
    }
  }

  // NEW FUNCTION: Find bubbles disconnected from the top and drop them
  function dropFloatingBubbles() {
    let connected = new Set();
    
    // Helper to check if a cell is valid and filled
    function isFilled(r, c) {
      return r >= 0 && r < ROWS && c >= 0 && c < COLS && grid[r][c] !== null;
    }

    // DFS starting from the top row to mark all connected bubbles
    function markConnected(row, col) {
      if (!isFilled(row, col)) return;
      let key = row + "," + col;
      if (connected.has(key)) return;
      
      connected.add(key);

      let isEven = row % 2 === 0;
      markConnected(row - 1, col + (isEven ? -1 : 0));
      markConnected(row - 1, col + (isEven ? 0 : 1));
      markConnected(row, col - 1);
      markConnected(row, col + 1);
      markConnected(row + 1, col + (isEven ? -1 : 0));
      markConnected(row + 1, col + (isEven ? 0 : 1));
    }

    // Start DFS from all bubbles in the top row
    for (let c = 0; c < COLS; c++) {
      if (isFilled(0, c)) {
        markConnected(0, c);
      }
    }

    // Now, find all bubbles that are filled but NOT in the "connected" set
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (grid[r][c] && !connected.has(r + "," + c)) {
          // This bubble is floating! Drop it.
          let bubble = grid[r][c];
          fallingBubbles.push({ 
            x: bubble.x, 
            y: bubble.y, 
            color: bubble.color, 
            vy: 2 // Initial downward velocity
          });
          grid[r][c] = null;
          score += 20; // Bonus points for dropping
        }
      }
    }
  }

  function gameLoop() {
    if (!gameRunning) return;
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  function handleMove(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    shooter.angle = Math.atan2(y - shooter.y, x - shooter.x);
    if (shooter.angle > 0) shooter.angle = 0;
    if (shooter.angle < -Math.PI) shooter.angle = -Math.PI;
  }

  function handleShoot() {
    if (!projectile && currentBubble && gameRunning) {
      projectile = { x: shooter.x, y: shooter.y, color: currentBubble.color, angle: shooter.angle };
      currentBubble = null;
    }
  }

  canvas.addEventListener("mousemove", (e) => handleMove(e.clientX, e.clientY));
  canvas.addEventListener("mousedown", handleShoot);
  canvas.addEventListener("touchmove", (e) => { e.preventDefault(); handleMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});
  canvas.addEventListener("touchstart", (e) => { e.preventDefault(); handleMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});
  canvas.addEventListener("touchend", (e) => { e.preventDefault(); handleShoot(); }, {passive: false});

</script>
</body>
