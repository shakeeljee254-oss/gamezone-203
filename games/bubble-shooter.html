  "name": "Bubble Shooter Pro",

</script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');

  body {
    margin: 0;
    overflow: hidden;
    background: radial-gradient(circle at center, #1e1b4b, #0f172a);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Poppins', sans-serif;
    touch-action: none;
    color: white;
  }
  canvas {
    background: #0f172a;
    box-shadow: 0 0 40px rgba(168, 85, 247, 0.2);
    border-radius: 12px;
    border: 2px solid #3b0764;
    max-width: 100%;
    max-height: 100vh;
  }
  #menuOverlay {
    position: absolute;
    background: rgba(15, 23, 42, 0.95);
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    z-index: 10;
    border: 2px solid #a855f7;
    box-shadow: 0 0 30px rgba(168, 85, 247, 0.4);
  }
  h1 { color: #d8b4fe; margin-top: 0; font-size: 32px; text-shadow: 0 0 10px #a855f7; }
  p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
  
  .difficulty-buttons {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  
  button {
    background: linear-gradient(90deg, #7e22ce, #a855f7);
    color: white;
    border: none;
    padding: 15px 30px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  button:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(168, 85, 247, 0.6); }
  button.easy { background: linear-gradient(90deg, #059669, #10b981); }
  button.normal { background: linear-gradient(90deg, #2563eb, #3b82f6); }
  button.hard { background: linear-gradient(90deg, #dc2626, #ef4444); }
</style>
</head>
<body>

  <div id="menuOverlay">
    <h1>BUBBLE SHOOTER</h1>
    <p>Select Difficulty</p>
    <div class="difficulty-buttons">
      <button class="easy" onclick="startGame('easy')">Easy</button>
      <button class="normal" onclick="startGame('normal')">Normal</button>
      <button class="hard" onclick="startGame('hard')">Hard</button>
    </div>
  </div>

  <canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const menuOverlay = document.getElementById("menuOverlay");

  let gameRunning = false;
  let score = 0;
  let difficulty = 'normal';
  
  // Grid Settings
  const BUBBLE_RADIUS = 16;
  const BUBBLE_DIAMETER = BUBBLE_RADIUS * 2;
  const COLS = 12;
  const ROWS = 14;
  
  // Colors with modern look
  const COLORS = ["#ef4444", "#3b82f6", "#10b981", "#f59e0b", "#8b5cf6", "#ec4899"];
  let activeColors = [];

  let grid = [];
  let shooter = { x: canvas.width / 2, y: canvas.height - 30, angle: 0 };
  let currentBubble = null;
  let nextBubble = null;
  let projectile = null;
  let shootSpeed = 12;
  let rowsToFill = 6;

  function startGame(diff) {
    difficulty = diff;
    menuOverlay.style.display = "none";
    gameRunning = true;
    score = 0;
    
    if (difficulty === 'easy') {
      activeColors = COLORS.slice(0, 3); // Only 3 colors
      rowsToFill = 4;
      shootSpeed = 10;
    } else if (difficulty === 'normal') {
      activeColors = COLORS.slice(0, 4); // 4 colors
      rowsToFill = 6;
      shootSpeed = 12;
    } else {
      activeColors = COLORS.slice(0, 6); // 6 colors
      rowsToFill = 8;
      shootSpeed = 15;
    }

    resetGame();
  }

  function resetGame() {
    grid = [];
    
    // Initialize Grid
    for (let r = 0; r < ROWS; r++) {
      grid[r] = [];
      for (let c = 0; c < COLS; c++) {
        if (r < rowsToFill) {
          grid[r][c] = {
            color: activeColors[Math.floor(Math.random() * activeColors.length)],
            x: c * BUBBLE_DIAMETER + BUBBLE_RADIUS + (r % 2 === 0 ? 0 : BUBBLE_RADIUS) + 5,
            y: r * BUBBLE_DIAMETER * 0.87 + BUBBLE_RADIUS + 5 // 0.87 for hex packing
          };
        } else {
          grid[r][c] = null;
        }
      }
    }
    
    currentBubble = createRandomBubble();
    nextBubble = createRandomBubble();
    projectile = null;
    
    gameLoop();
  }

  function createRandomBubble() {
    return { color: activeColors[Math.floor(Math.random() * activeColors.length)] };
  }

  function drawBubble(x, y, color, isProjectile = false) {
    // Glow effect
    ctx.shadowBlur = isProjectile ? 20 : 10;
    ctx.shadowColor = color;

    ctx.beginPath();
    ctx.arc(x, y, BUBBLE_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();

    // Reset shadow for highlight
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(x - 4, y - 4, BUBBLE_RADIUS / 2.5, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.fill();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Grid
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (grid[r][c]) {
          drawBubble(grid[r][c].x, grid[r][c].y, grid[r][c].color);
        }
      }
    }

    // Draw Aim Line
    if (gameRunning && !projectile) {
      ctx.beginPath();
      ctx.moveTo(shooter.x, shooter.y);
      ctx.lineTo(shooter.x + Math.cos(shooter.angle) * 120, shooter.y + Math.sin(shooter.angle) * 120);
      ctx.strokeStyle = "rgba(255,255,255,0.2)";
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Draw Shooter Base
    ctx.beginPath();
    ctx.arc(shooter.x, shooter.y, 28, 0, Math.PI * 2);
    ctx.fillStyle = "#1e293b";
    ctx.fill();
    ctx.strokeStyle = "#a855f7";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Draw Current Bubble
    if (currentBubble) {
      drawBubble(shooter.x, shooter.y, currentBubble.color);
    }

    // Draw Next Bubble
    if (nextBubble) {
      drawBubble(40, canvas.height - 30, nextBubble.color);
      ctx.fillStyle = "#94a3b8";
      ctx.font = "12px Poppins";
      ctx.textAlign = "center";
      ctx.fillText("NEXT", 40, canvas.height - 60);
    }

    // Draw Projectile
    if (projectile) {
      drawBubble(projectile.x, projectile.y, projectile.color, true);
    }

    // Draw Score
    ctx.fillStyle = "white";
    ctx.font = "bold 22px Poppins";
    ctx.textAlign = "right";
    ctx.fillText("Score: " + score, canvas.width - 20, 35);
  }

  function update() {
    if (!gameRunning || !projectile) return;

    projectile.x += Math.cos(projectile.angle) * shootSpeed;
    projectile.y += Math.sin(projectile.angle) * shootSpeed;

    // Wall Collision
    if (projectile.x < BUBBLE_RADIUS) {
      projectile.x = BUBBLE_RADIUS;
      projectile.angle = Math.PI - projectile.angle;
    }
    if (projectile.x > canvas.width - BUBBLE_RADIUS) {
      projectile.x = canvas.width - BUBBLE_RADIUS;
      projectile.angle = Math.PI - projectile.angle;
    }

    // Top Collision
    if (projectile.y < BUBBLE_RADIUS) {
      snapBubble();
      return;
    }

    // Grid Collision Check
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (grid[r][c]) {
          let dist = Math.hypot(projectile.x - grid[r][c].x, projectile.y - grid[r][c].y);
          if (dist < BUBBLE_DIAMETER - 4) { // -4 for tighter fit
            snapBubble();
            return;
          }
        }
      }
    }
  }

  function snapBubble() {
    let closestR = 0, closestC = 0, minDist = Infinity;
    
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (!grid[r][c]) {
          let expectedX = c * BUBBLE_DIAMETER + BUBBLE_RADIUS + (r % 2 === 0 ? 0 : BUBBLE_RADIUS) + 5;
          let expectedY = r * BUBBLE_DIAMETER * 0.87 + BUBBLE_RADIUS + 5;
          let dist = Math.hypot(projectile.x - expectedX, projectile.y - expectedY);
          if (dist < minDist) {
            minDist = dist;
            closestR = r;
            closestC = c;
          }
        }
      }
    }

    let snapX = closestC * BUBBLE_DIAMETER + BUBBLE_RADIUS + (closestR % 2 === 0 ? 0 : BUBBLE_RADIUS) + 5;
    let snapY = closestR * BUBBLE_DIAMETER * 0.87 + BUBBLE_RADIUS + 5;
    
    grid[closestR][closestC] = { color: projectile.color, x: snapX, y: snapY };

    projectile = null;
    checkMatches(closestR, closestC);
    
    currentBubble = nextBubble;
    nextBubble = createRandomBubble();
  }

  function checkMatches(r, c) {
    let targetColor = grid[r][c].color;
    let matches = [];
    let visited = new Set();

    function dfs(row, col) {
      if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;
      if (!grid[row][col] || grid[row][col].color !== targetColor) return;
      
      let key = row + "," + col;
      if (visited.has(key)) return;
      
      visited.add(key);
      matches.push({r: row, c: col});

      let isEven = row % 2 === 0;
      dfs(row - 1, col + (isEven ? -1 : 0));
      dfs(row - 1, col + (isEven ? 0 : 1));
      dfs(row, col - 1);
      dfs(row, col + 1);
      dfs(row + 1, col + (isEven ? -1 : 0));
      dfs(row + 1, col + (isEven ? 0 : 1));
    }

    dfs(r, c);

    if (matches.length >= 3) {
      matches.forEach(m => {
        grid[m.r][m.c] = null;
        score += 10;
      });
    }
  }

  function gameLoop() {
    if (!gameRunning) return;
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  // Controls
  function handleMove(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    shooter.angle = Math.atan2(y - shooter.y, x - shooter.x);
    if (shooter.angle > 0) shooter.angle = 0;
    if (shooter.angle < -Math.PI) shooter.angle = -Math.PI;
  }

  function handleShoot() {
    if (!projectile && currentBubble && gameRunning) {
      projectile = { x: shooter.x, y: shooter.y, color: currentBubble.color, angle: shooter.angle };
      currentBubble = null;
    }
  }

  canvas.addEventListener("mousemove", (e) => handleMove(e.clientX, e.clientY));
  canvas.addEventListener("mousedown", handleShoot);
  canvas.addEventListener("touchmove", (e) => { e.preventDefault(); handleMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});
  canvas.addEventListener("touchstart", (e) => { e.preventDefault(); handleMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});
  canvas.addEventListener("touchend", (e) => { e.preventDefault(); handleShoot(); }, {passive: false});

</script>
</body>
</html>
