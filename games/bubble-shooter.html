<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bubble Pop 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#f4f6ff; --glass:rgba(255,255,255,.09); --edge:rgba(255,255,255,.2); --bg:#0b1030; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden; overscroll-behavior:none;
    font-family:'Fredoka', ui-rounded, 'Segoe UI', system-ui, sans-serif; color:var(--ink); }
  #game { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair; }
  
  /* HUD FIX: Next bubble position aur mobile safe area */
  #hud { position:fixed; inset:0; display:flex; flex-direction:column; justify-content:space-between; pointer-events:none;
    padding:max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(90px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
  .row { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .row.bottom { align-items:flex-end; }
  .pill { background:var(--glass); border:1px solid var(--edge); border-radius:18px; padding:8px 16px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); display:flex; flex-direction:column; align-items:flex-end; min-width:92px; }
  .pill.left { align-items:flex-start; }
  .pill small { font-size:.75rem; font-weight:500; opacity:.7; }
  .pill b { font-size:1.7rem; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums; }
  
  .next { display:flex; align-items:center; gap:10px; background:var(--glass); border:1px solid var(--edge); border-radius:999px;
    padding:8px 16px 8px 8px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); position:absolute; bottom:max(14px, env(safe-area-inset-bottom)); left:max(14px, env(safe-area-inset-left)); }
  #nextBubble { width:44px; height:44px; border-radius:50%; transition:background .25s; box-shadow:inset -4px -6px 10px rgba(0,0,0,.25), 0 4px 12px rgba(0,0,0,.35); }
  .next span { font-weight:600; }
  
  #overlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:20px;
    background:rgba(5,8,28,.6); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); z-index:10; }
  #overlay.show { display:flex; }
  .card { width:min(360px, 100%); text-align:center; background:linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
    border:1px solid var(--edge); border-radius:28px; padding:28px 24px; box-shadow:0 24px 60px rgba(0,0,0,.5); animation:pop .35s cubic-bezier(.2,1.4,.4,1); }
  .card h1 { margin:0 0 6px; font-size:2.1rem; }
  .card p { margin:0 0 20px; opacity:.85; font-size:1.1rem; }
  button { font:inherit; font-weight:700; font-size:1.1rem; color:#14102e; border:0; border-radius:999px; padding:12px 32px; cursor:pointer;
    background:linear-gradient(135deg,#ffe14d,#ff9f1c); box-shadow:0 6px 0 #b86a00, 0 10px 20px rgba(0,0,0,.35); }
  button:active { transform:translateY(3px); box-shadow:0 3px 0 #b86a00; }
  button:focus-visible { outline:3px solid #fff; outline-offset:3px; }
  @keyframes pop { from { transform:scale(.8); opacity:0; } to { transform:scale(1); opacity:1; } }
  @media (prefers-reduced-motion:reduce) { .card { animation:none; } }
  @media (max-width:480px) { .pill b { font-size:1.4rem; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="row">
    <div class="pill left"><small>Level</small><b id="level">1</b></div>
    <div class="pill"><small>Score</small><b id="score">0</b></div>
  </div>
  <div class="row bottom">
    <div class="next"><div id="nextBubble"></div><span>Next</span></div>
  </div>
</div>

<div id="overlay" role="dialog" aria-live="polite">
  <div class="card">
    <h1 id="ovTitle">Game over</h1>
    <p id="ovText"></p>
    <button id="ovBtn">Play again</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';

  // ---------- Constants ----------
  const COLORS = [0xff3b5c, 0xff9f1c, 0xffe14d, 0x2ee66b, 0x2ec4ff, 0xb15cff];
  const COLS = 11, W = COLS * 2, RH = Math.sqrt(3), MAXROW = 13, SPEED = 48;
  const rowCols = r => (r % 2 ? COLS - 1 : COLS);
  const cx = (r, c) => (r % 2 ? 2 + 2 * c : 1 + 2 * c);
  const cy = r => -1 - r * RH;
  const key = (r, c) => r * 100 + c;
  const hex = n => '#' + n.toString(16).padStart(6, '0');
  const SP = new THREE.Vector3(W / 2, cy(13.2), 0); 
  const CENTER_Y = -14.5;

  // ---------- Renderer / scene ----------
  const canvas = document.getElementById('game');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1030);
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);

  // Soft-box environment map
  const envCanvas = document.createElement('canvas');
  envCanvas.width = 256; envCanvas.height = 128;
  const ex = envCanvas.getContext('2d');
  const eg = ex.createLinearGradient(0, 0, 0, 128);
  eg.addColorStop(0, '#9fb4ff'); eg.addColorStop(.5, '#2a2f6b'); eg.addColorStop(1, '#0b1030');
  ex.fillStyle = eg; ex.fillRect(0, 0, 256, 128);
  ex.fillStyle = '#fff';
  ex.fillRect(30, 20, 50, 30); ex.fillRect(150, 14, 70, 22); ex.fillRect(100, 70, 30, 14);
  const envTex = new THREE.CanvasTexture(envCanvas);
  envTex.mapping = THREE.EquirectangularReflectionMapping;
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envRT = pmrem.fromEquirectangular(envTex);
  scene.environment = envRT.texture;
  envTex.dispose(); pmrem.dispose();

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(3, 6, 30);
  sun.target.position.set(W / 2, CENTER_Y, 0);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 26, bottom: -26, near: 1, far: 90 });
  sun.shadow.bias = -0.0004;
  scene.add(sun, sun.target);
  const pt = new THREE.PointLight(0xaec8ff, 0.5, 90);
  pt.position.set(W / 2, -4, 22);
  scene.add(pt);

  // Backdrop, walls, ceiling
  const disposables = [envRT, renderer];
  const mk = (geo, mat) => { disposables.push(geo, mat); return new THREE.Mesh(geo, mat); };
  const back = mk(new THREE.PlaneGeometry(70, 80), new THREE.MeshStandardMaterial({ color: 0x151b4d, roughness: 0.95 }));
  back.position.set(W / 2, CENTER_Y, -1.8); back.receiveShadow = true; scene.add(back);
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x6f86ff, emissive: 0x2a3cc0, emissiveIntensity: .6, roughness: .4 });
  const wallL = mk(new THREE.BoxGeometry(.4, 34, 1.6), wallMat); wallL.position.set(-.2, CENTER_Y - 1, -.2);
  const wallR = wallL.clone(); wallR.position.x = W + .2;
  const ceil = mk(new THREE.BoxGeometry(W + .8, .4, 1.6), wallMat); ceil.position.set(W / 2, .2, -.2);
  scene.add(wallL, wallR, ceil);
  const danger = mk(new THREE.BoxGeometry(W, .08, .1), new THREE.MeshBasicMaterial({ color: 0xff3b5c, transparent: true, opacity: .45 }));
  danger.position.set(W / 2, cy(MAXROW - .5), -.9); scene.add(danger);

  // Bubble geometry + materials
  const bubbleGeo = new THREE.SphereGeometry(1, 40, 28);
  disposables.push(bubbleGeo);
  const mats = COLORS.map(c => {
    const m = new THREE.MeshPhysicalMaterial({ color: c, roughness: .12, metalness: .05, clearcoat: 1, clearcoatRoughness: .05, reflectivity: .9, envMapIntensity: 1.2 });
    disposables.push(m); return m;
  });
  const makeBubble = ci => {
    const m = new THREE.Mesh(bubbleGeo, mats[ci]);
    m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
  };

  // Shooter
  const shooter = new THREE.Group();
  shooter.position.copy(SP);
  const ring = mk(new THREE.TorusGeometry(1.9, .22, 16, 48), new THREE.MeshStandardMaterial({ color: 0xdfe6ff, metalness: .6, roughness: .25 }));
  const barrel = mk(new THREE.CylinderGeometry(.5, .7, 3, 20), new THREE.MeshStandardMaterial({ color: 0x8fa2ff, metalness: .5, roughness: .3 }));
  barrel.position.set(0, 2, -.4); barrel.castShadow = true;
  const barrelPivot = new THREE.Group(); barrelPivot.add(barrel);
  shooter.add(ring, barrelPivot); scene.add(shooter);

  // Aim dots
  const MAXDOTS = 70;
  const dotGeo = new THREE.BufferGeometry();
  dotGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MAXDOTS * 3), 3));
  const dotMat = new THREE.PointsMaterial({ color: 0xffffff, size: .42, transparent: true, opacity: .85, depthWrite: false });
  disposables.push(dotGeo, dotMat);
  const dots = new THREE.Points(dotGeo, dotMat); dots.frustumCulled = false; scene.add(dots);

  // ---------- State ----------
  const grid = new Map();
  const falling = [], fx = [];
  let cur = null, nextColor = 0, shot = null;
  let state = 'play', score = 0, level = 1, aimAngle = Math.PI / 2, aiming = false;
  const dir = new THREE.Vector2(0, 1);
  const $ = id => document.getElementById(id);

  const presentColors = () => { const s = new Set(); grid.forEach(b => s.add(b.color)); return [...s]; };
  const pickColor = () => { const p = presentColors(); return p.length ? p[(Math.random() * p.length) | 0] : 0; };
  const setScore = v => { score = v; $('score').textContent = v; };
  const showNext = () => { const h = hex(COLORS[nextColor]); $('nextBubble').style.background = `radial-gradient(circle at 32% 28%, #fff 0 8%, ${h} 40%, ${h} 100%)`; };

  function neighbors(r, c) {
    const o = [[r, c - 1], [r, c + 1]], d = r % 2 ? [0, 1] : [-1, 0];
    for (const rr of [r - 1, r + 1]) for (const k of d) o.push([rr, c + k]);
    return o.filter(([a, b]) => a >= 0 && b >= 0 && b < rowCols(a));
  }

  // ---------- Level setup ----------
  function clearAll() {
    grid.forEach(b => scene.remove(b.mesh)); grid.clear();
    falling.forEach(f => scene.remove(f.mesh)); falling.length = 0;
    fx.forEach(removeFx); fx.length = 0;
    if (shot) { scene.remove(shot.mesh); shot = null; }
    if (cur) { scene.remove(cur.mesh); cur = null; }
  }
  function buildLevel() {
    clearAll();
    const rows = 6 + Math.min(level, 4);
    for (let r = 0; r < rows; r++) for (let c = 0; c < rowCols(r); c++) {
      let ci = (Math.random() * COLORS.length) | 0;
      if (c > 0 && Math.random() < .4) ci = grid.get(key(r, c - 1)).color;
      else if (r > 0 && Math.random() < .25) ci = grid.get(key(r - 1, Math.min(c, rowCols(r - 1) - 1))).color;
      const mesh = makeBubble(ci);
      mesh.position.set(cx(r, c), cy(r), 0);
      grid.set(key(r, c), { mesh, color: ci, r, c });
    }
    $('level').textContent = level;
    nextColor = pickColor();
    loadShooter();
    state = 'play';
    $('overlay').classList.remove('show');
    dots.visible = true; // Ensure dots are visible on start
  }
  function loadShooter() {
    const ci = nextColor;
    cur = { color: ci, mesh: makeBubble(ci) };
    cur.mesh.position.copy(SP);
    nextColor = pickColor(); showNext();
  }
  function ensurePlayable() {
    const p = presentColors();
    if (!p.length) return;
    if (cur && !p.includes(cur.color)) { cur.color = p[(Math.random() * p.length) | 0]; cur.mesh.material = mats[cur.color]; }
    if (!p.includes(nextColor)) { nextColor = p[(Math.random() * p.length) | 0]; showNext(); }
  }

  // ---------- Aiming ----------
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), tmp = new THREE.Vector3();
  function hitsGrid(x, y) {
    for (const b of grid.values()) {
      const dy = b.mesh.position.y - y; if (dy > 1.9 || dy < -1.9) continue;
      const dx = b.mesh.position.x - x; if (dx * dx + dy * dy < 3.4) return true;
    }
    return false;
  }
  function updateAim() {
    barrelPivot.rotation.z = aimAngle - Math.PI / 2;
    const arr = dotGeo.attributes.position.array;
    let x = SP.x, y = SP.y, vx = dir.x, vy = dir.y, dist = 0, nextAt = 2.6, n = 0;
    for (let i = 0; i < 500 && n < MAXDOTS; i++) {
      x += vx * .4; y += vy * .4;
      if (x < 1) { x = 2 - x; vx = -vx; } else if (x > W - 1) { x = 2 * (W - 1) - x; vx = -vx; }
      if (y >= -1 || hitsGrid(x, y)) break;
      dist += .4;
      if (dist >= nextAt) { arr[n * 3] = x; arr[n * 3 + 1] = y; arr[n * 3 + 2] = 0; n++; nextAt += 1.6; }
    }
    dotGeo.setDrawRange(0, n);
    dotGeo.attributes.position.needsUpdate = true;
  }
  function aimAt(ev) {
    const rect = canvas.getBoundingClientRect();
    ndc.set(((ev.clientX - rect.left) / rect.width) * 2 - 1, -((ev.clientY - rect.top) / rect.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    if (!ray.ray.intersectPlane(plane, tmp)) return;
    let a = Math.atan2(tmp.y - SP.y, tmp.x - SP.x);
    aimAngle = Math.min(Math.PI - .17, Math.max(.17, a));
    dir.set(Math.cos(aimAngle), Math.sin(aimAngle));
    updateAim();
  }

  // ---------- Shooting ----------
  function fire() {
    if (state !== 'play' || shot || !cur) return;
    shot = { mesh: cur.mesh, color: cur.color, dx: dir.x, dy: dir.y };
    cur = null;
    dots.visible = false; // FIX: Hide aim dots immediately after shooting
  }
  function stepShot(dt) {
    let move = SPEED * dt;
    while (move > 0 && shot) {
      const s = Math.min(.25, move); move -= s;
      const p = shot.mesh.position;
      p.x += shot.dx * s; p.y += shot.dy * s;
      if (p.x < 1) { p.x = 2 - p.x; shot.dx = -shot.dx; }
      else if (p.x > W - 1) { p.x = 2 * (W - 1) - p.x; shot.dx = -shot.dx; }
      if (p.y >= -1 || hitsGrid(p.x, p.y)) land();
    }
  }
  function land() {
    const p = shot.mesh.position;
    const r0 = Math.round((-1 - p.y) / RH);
    let best = null, bd = 1e9;
    for (let r = Math.max(0, r0 - 1); r <= r0 + 1; r++) for (let c = 0; c < rowCols(r); c++) {
      if (grid.has(key(r, c))) continue;
      const dx = cx(r, c) - p.x, dy = cy(r) - p.y, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = { r, c }; }
    }
    const b = { mesh: shot.mesh, color: shot.color, r: best.r, c: best.c };
    b.mesh.position.set(cx(b.r, b.c), cy(b.r), 0);
    grid.set(key(b.r, b.c), b);
    shot = null;

    // Match-3
    const seen = new Set([key(b.r, b.c)]), stack = [b], group = [];
    while (stack.length) {
      const n = stack.pop(); group.push(n);
      for (const [r, c] of neighbors(n.r, n.c)) {
        const k = key(r, c), o = grid.get(k);
        if (o && !seen.has(k) && o.color === b.color) { seen.add(k); stack.push(o); }
      }
    }
    if (group.length >= 3) {
      group.forEach(n => { burst(n.mesh.position.x, n.mesh.position.y, COLORS[n.color]); scene.remove(n.mesh); grid.delete(key(n.r, n.c)); });
      setScore(score + group.length * 10);
      dropFloating();
    }

    // Outcome
    let lost = false; grid.forEach(n => { if (n.r >= MAXROW) lost = true; });
    if (lost) return endGame(false);
    if (!grid.size) return endGame(true);
    ensurePlayable();
    loadShooter();
    updateAim();
    dots.visible = true; // FIX: Show dots again after next bubble loads
  }
  function dropFloating() {
    const ok = new Set(), stack = [];
    grid.forEach(n => { if (n.r === 0) { ok.add(key(n.r, n.c)); stack.push(n); } });
    while (stack.length) {
      const n = stack.pop();
      for (const [r, c] of neighbors(n.r, n.c)) {
        const k = key(r, c), o = grid.get(k);
        if (o && !ok.has(k)) { ok.add(k); stack.push(o); }
      }
    }
    [...grid.entries()].forEach(([k, n]) => {
      if (ok.has(k)) return;
      grid.delete(k);
      falling.push({ mesh: n.mesh, vx: (Math.random() - .5) * 8, vy: Math.random() * 6, vz: Math.random() * 6,
        rx: (Math.random() - .5) * 6, rz: (Math.random() - .5) * 6 });
      setScore(score + 10);
    });
  }

  // ---------- Particles ----------
  function burst(x, y, color) {
    const N = 22, pos = new Float32Array(N * 3), vel = [];
    for (let i = 0; i < N; i++) {
      pos[i * 3] = x; pos[i * 3 + 1] = y;
      const a = Math.random() * Math.PI * 2, s = 5 + Math.random() * 9;
      vel.push(Math.cos(a) * s, Math.sin(a) * s, (Math.random() - .3) * 8);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ color, size: .6, transparent: true, depthWrite: false });
    const pts = new THREE.Points(geo, mat); pts.frustumCulled = false; scene.add(pts);
    fx.push({ pts, geo, mat, vel, life: 0 });
  }
  function removeFx(f) { scene.remove(f.pts); f.geo.dispose(); f.mat.dispose(); }

  // ---------- End states ----------
  function endGame(won) {
    state = won ? 'won' : 'lost';
    setTimeout(() => {
      $('ovTitle').textContent = won ? 'Level complete!' : 'Game over';
      $('ovText').textContent = `Score: ${score}`;
      $('ovBtn').textContent = won ? 'Next level' : 'Play again';
      $('overlay').classList.add('show');
      $('ovBtn').focus();
    }, won ? 900 : 300);
  }
  $('ovBtn').addEventListener('click', () => {
    if (state === 'won') level++; else { level = 1; setScore(0); }
    buildLevel(); updateAim();
  });

  // ---------- Input ----------
  const onDown = e => { if (state !== 'play') return; aiming = true; canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId); aimAt(e); };
  const onMove = e => { if (state === 'play') aimAt(e); };
  const onUp = e => { if (!aiming) return; aiming = false; if (state === 'play') { aimAt(e); fire(); } };
  const onCancel = () => { aiming = false; };
  
  // Mobile touch fix: add touch events as fallback for older browsers
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onCancel);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); onDown(e.touches[0]); }, {passive: false});
  canvas.addEventListener('touchmove', e => { e.preventDefault(); onMove(e.touches[0]); }, {passive: false});
  canvas.addEventListener('touchend', e => { e.preventDefault(); onUp(e.changedTouches[0]); }, {passive: false});

  // ---------- Resize ----------
  function resize() {
    const w = window.innerWidth, h = window.innerHeight, aspect = w / h;
    renderer.setSize(w, h, false);
    camera.aspect = aspect; camera.updateProjectionMatrix();
    const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const d = Math.max(19.5 / t, 13.5 / (t * aspect)) * 1.04;
    camera.position.set(W / 2, CENTER_Y + d * 0.22, d);
    camera.lookAt(W / 2, CENTER_Y, 0);
    camera.updateMatrixWorld();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  // ---------- Loop ----------
  const clock = new THREE.Clock();
  let raf = 0;
  function loop() {
    raf = requestAnimationFrame(loop);
    const dt = Math.min(clock.getDelta(), .05);
    if (shot) stepShot(dt);
    for (let i = falling.length - 1; i >= 0; i--) {
      const f = falling[i], m = f.mesh;
      f.vy -= 60 * dt;
      m.position.x += f.vx * dt; m.position.y += f.vy * dt; m.position.z += f.vz * dt;
      m.rotation.x += f.rx * dt; m.rotation.z += f.rz * dt;
      if (m.position.y < -60) { scene.remove(m); falling.splice(i, 1); }
    }
    for (let i = fx.length - 1; i >= 0; i--) {
      const f = fx[i]; f.life += dt;
      const a = f.geo.attributes.position.array;
      for (let k = 0; k < a.length; k += 3) {
        f.vel[k + 1] -= 25 * dt;
        a[k] += f.vel[k] * dt; a[k + 1] += f.vel[k + 1] * dt; a[k + 2] += f.vel[k + 2] * dt;
      }
      f.geo.attributes.position.needsUpdate = true;
      f.mat.opacity = Math.max(0, 1 - f.life / .9);
      if (f.life >= .9) { removeFx(f); fx.splice(i, 1); }
    }
    if (cur) cur.mesh.rotation.y += dt;
    renderer.render(scene, camera);
  }

  // ---------- Cleanup ----------
  function dispose() {
    cancelAnimationFrame(raf);
    window.removeEventListener('resize', resize);
    window.removeEventListener('orientationchange', resize);
    canvas.removeEventListener('pointerdown', onDown);
    canvas.removeEventListener('pointermove', onMove);
    canvas.removeEventListener('pointerup', onUp);
    canvas.removeEventListener('pointercancel', onCancel);
    clearAll();
    disposables.forEach(o => o.dispose && o.dispose());
  }
  window.addEventListener('pagehide', dispose);

  // ---------- Start ----------
  resize();
  buildLevel();
  updateAim();
  loop();
})();
</script>
</body>
</html>
