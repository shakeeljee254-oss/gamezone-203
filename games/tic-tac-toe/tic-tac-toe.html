<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe | GameZone 203</title>
<style>
:root{--bg:#f5f7fb;--ink:#172033;--muted:#718096;--blue:#4169e1;--pink:#ed5b91;--line:#e6ebf2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;display:grid;place-items:center;background:radial-gradient(circle at top left,#eaf0ff,transparent 38%),var(--bg);color:var(--ink);font-family:system-ui,Segoe UI,sans-serif}
.app{width:min(100%,480px);background:white;border:1px solid var(--line);border-radius:26px;padding:26px;box-shadow:0 18px 50px #1d2d4d1a}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:800}.home{color:var(--blue);text-decoration:none;font-weight:700;font-size:14px}
h1{text-align:center;margin:0;font-size:38px;letter-spacing:-1px}.sub{text-align:center;color:var(--muted);margin:7px 0 24px;font-size:14px}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}.score{background:#f7f9fd;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}.score.active{background:#f0f4ff;border-color:#b9c8ff}.label{font-size:12px;color:var(--muted);font-weight:700}.value{font-size:27px;font-weight:850}.x{color:var(--blue)}.o{color:var(--pink)}
#status{min-height:46px;display:grid;place-items:center;text-align:center;color:#475569;font-weight:750;margin:8px 0 16px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cell{aspect-ratio:1;border:1px solid var(--line);border-radius:18px;background:#f8faff;cursor:pointer;font-size:58px;font-weight:850;display:grid;place-items:center;transition:.14s}.cell:hover:enabled{transform:translateY(-2px);background:#f0f4ff;border-color:#cbd6ff}.cell:disabled{cursor:default}.cell.win{background:#eaf8f0;border-color:#9bd8b3}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.action{border:0;border-radius:14px;padding:14px 10px;font:700 14px system-ui;cursor:pointer;background:#edf2ff;color:#3155bd}.primary{background:var(--blue);color:white}.note{text-align:center;font-size:12px;color:#94a3b8;margin:18px 0 0}
@media(max-width:420px){.app{padding:20px}.cell{font-size:50px}}
</style>
</head>
<body>
<main class="app">
<div class="top"><div class="brand">GAMEZONE 203</div><a class="home" href="../../index.html">← Home</a></div>
<h1>Tic Tac Toe</h1><p class="sub">A classic game for two players</p>
<div class="scores">
<div class="score active" id="xCard"><div class="label"><span class="x">X</span> · Player 1</div><div class="value" id="xScore">0</div></div>
<div class="score" id="oCard"><div class="label"><span class="o">O</span> · Player 2</div><div class="value" id="oScore">0</div></div>
</div>
<div id="status" role="status" aria-live="polite">Player 1's turn — X</div>
<div class="board" aria-label="Tic Tac Toe board">
<button class="cell" data-i="0" aria-label="Cell 1"></button><button class="cell" data-i="1" aria-label="Cell 2"></button><button class="cell" data-i="2" aria-label="Cell 3"></button>
<button class="cell" data-i="3" aria-label="Cell 4"></button><button class="cell" data-i="4" aria-label="Cell 5"></button><button class="cell" data-i="5" aria-label="Cell 6"></button>
<button class="cell" data-i="6" aria-label="Cell 7"></button><button class="cell" data-i="7" aria-label="Cell 8"></button><button class="cell" data-i="8" aria-label="Cell 9"></button>
</div>
<div class="actions"><button class="action primary" id="newRound">New Round</button><button class="action" id="reset">Reset Scores</button></div>
<p class="note">Take turns, make a line of three, and win!</p>
</main>
<script>
(()=>{
const cells=[...document.querySelectorAll('.cell')],status=document.getElementById('status'),xs=document.getElementById('xScore'),os=document.getElementById('oScore'),xc=document.getElementById('xCard'),oc=document.getElementById('oCard');
const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let board=Array(9).fill(''),turn='X',scores={X:0,O:0},done=false;
function turnText(){status.textContent=turn==='X'?"Player 1's turn — X":"Player 2's turn — O";xc.classList.toggle('active',turn==='X'&&!done);oc.classList.toggle('active',turn==='O'&&!done)}
function move(i){if(done||board[i])return;board[i]=turn;cells[i].textContent=turn;cells[i].classList.add(turn.toLowerCase());cells[i].disabled=true;
const win=lines.find(line=>line.every(n=>board[n]===turn));
if(win){done=true;scores[turn]++;xs.textContent=scores.X;os.textContent=scores.O;win.forEach(n=>cells[n].classList.add('win'));status.textContent=turn==='X'?'Player 1 wins! 🎉':'Player 2 wins! 🎉';xc.classList.remove('active');oc.classList.remove('active');cells.forEach(c=>c.disabled=true);return}
if(board.every(Boolean)){done=true;status.textContent="It's a draw! 🤝";xc.classList.remove('active');oc.classList.remove('active');return}
turn=turn==='X'?'O':'X';turnText()}
function fresh(){board=Array(9).fill('');turn='X';done=false;cells.forEach(c=>{c.textContent='';c.disabled=false;c.classList.remove('x','o','win')});turnText()}
cells.forEach(c=>c.addEventListener('click',()=>move(Number(c.dataset.i))));
document.getElementById('newRound').addEventListener('click',fresh);
document.getElementById('reset').addEventListener('click',()=>{scores={X:0,O:0};xs.textContent='0';os.textContent='0';fresh()});
fresh();
})();
</script>
</body>
</html>
