<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#f7f4ed">
  
  <title>2048 Game - Play Free Online | GameZone 203</title>
  <meta name="description" content="Play the classic 2048 puzzle game for free online at GameZone 203. Join the numbers and get to the 2048 tile! Works on mobile and desktop.">
  <link rel="canonical" href="https://shakeeljee254-oss.github.io/gamezone-203/games/2048/2048.html">
<meta property="og:title" content="2048 Game - Play Free Online | GameZone 203">
<meta property="og:description" content="Play the classic 2048 puzzle game for free online at GameZone 203.">
<meta property="og:image" content="https://shakeeljee254-oss.github.io/gamezone-203/cover.png">
<meta property="og:url" content="https://shakeeljee254-oss.github.io/gamezone-203/games/2048/2048.html">
  <style>
    :root {
      --page: #f7f4ed;
      --ink: #514b43;
      --muted: #8b8378;
      --board: #b9afa1;
      --empty: #d8d0c4;
      --accent: #8f7a66;
      --white: #fffdf9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px 40px;
      background: radial-gradient(circle at top, #fffdf8 0, var(--page) 58%, #eee8dd 100%);
      color: var(--ink);
      font-family: Inter, ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }
    .app { width: min(100%, 480px); }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
    .brand { font-size: 12px; font-weight: 800; letter-spacing: .16em; color: var(--muted); text-transform: uppercase; }
    .back {
      color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 700;
      border: 1px solid #ded6ca; border-radius: 999px; padding: 9px 13px;
      background: rgba(255,255,255,.55);
    }
    .heading { display: flex; align-items: end; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: clamp(54px, 13vw, 76px); line-height: .95; letter-spacing: -.075em; color: #77634f; }
    .subtitle { margin: 12px 0 0; color: var(--muted); font-size: 14px; }
    .scores { display: flex; gap: 8px; }
    .score-box {
      min-width: 76px; padding: 9px 12px 8px; border-radius: 12px;
      background: #e8dfd2; text-align: center;
    }
    .score-label { display: block; color: #8a7b69; font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .score-value { display: block; color: #625342; font-size: 21px; font-weight: 800; line-height: 1.2; }
    .toolbar { display: flex; gap: 9px; margin: 22px 0 14px; }
    button {
      border: 0; cursor: pointer; font: inherit; font-weight: 750;
      border-radius: 10px; padding: 11px 14px; transition: transform .12s, filter .12s;
    }
    button:active { transform: scale(.97); }
    .primary { background: #8f7a66; color: white; flex: 1; }
    .secondary { background: #e9e1d6; color: #6e5d4b; }
    .board {
      position: relative; display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 10px; padding: 10px; background: var(--board); border-radius: 15px;
      aspect-ratio: 1; touch-action: none; user-select: none;
      box-shadow: 0 12px 30px rgba(83, 68, 50, .12);
    }
    .cell {
      min-width: 0; border-radius: 10px; background: var(--empty);
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(23px, 7vw, 39px); font-weight: 850; letter-spacing: -.06em;
      color: #64584b; transition: background .1s;
    }
    .v2 { background: #f1e8dc; }
    .v4 { background: #ede0ca; }
    .v8 { background: #e9b978; color: #fffaf2; }
    .v16 { background: #e69b61; color: white; }
    .v32 { background: #df805b; color: white; }
    .v64 { background: #d85f45; color: white; }
    .v128 { background: #d9bd68; color: white; font-size: clamp(20px, 6vw, 33px); }
    .v256 { background: #cdae4e; color: white; font-size: clamp(20px, 6vw, 33px); }
    .v512 { background: #b99b42; color: white; font-size: clamp(20px, 6vw, 33px); }
    .v1024, .v2048, .vhigh { background: #9c813b; color: white; font-size: clamp(17px, 5vw, 28px); }
    .help { margin: 18px 2px 0; color: var(--muted); font-size: 13px; line-height: 1.6; text-align: center; }
    .help strong { color: #6e5d4b; }
    .message {
      position: absolute; inset: 10px; display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px; border-radius: 10px;
      background: rgba(247,244,237,.86); backdrop-filter: blur(3px); text-align: center;
    }
    .message.show { display: flex; }
    .message h2 { margin: 0; font-size: 32px; color: #705d49; }
    .message p { margin: 0; color: #776d61; }
    .message button { background: #8f7a66; color: white; }
    @media (max-width: 380px) {
      body { padding: 18px 12px 28px; }
      .board { gap: 7px; padding: 7px; }
      .cell { border-radius: 8px; }
      .scores { gap: 5px; }
      .score-box { min-width: 65px; padding-inline: 8px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topline">
      <div class="brand">GameZone 203 · Original Games</div>
      <a class="back" href="../../index.html">← Home</a>
    </div>

    <div class="heading">
      <div>
        <h1>2048</h1>
        <p class="subtitle">Join the tiles. Reach the 2048 tile.</p>
      </div>
      <div class="scores" aria-live="polite">
        <div class="score-box"><span class="score-label">Score</span><span class="score-value" id="score">0</span></div>
        <div class="score-box"><span class="score-label">Best</span><span class="score-value" id="best">0</span></div>
      </div>
    </div>

    <div class="toolbar">
      <button class="primary" id="newGame">New Game</button>
      <button class="secondary" id="undo" disabled>Undo</button>
    </div>

    <section class="board" id="board" aria-label="2048 game board">
      <div class="message" id="message">
        <h2 id="messageTitle">Game Over</h2>
        <p id="messageText">No more moves available.</p>
        <button id="messageButton">Try Again</button>
      </div>
    </section>
    <p class="help"><strong>How to play:</strong> Use your arrow keys, swipe on mobile, or drag with mouse. Combine matching numbers to make bigger tiles. Reach <strong>2048</strong> to win!</p>
  </main>

  <script>
    (() => {
      "use strict";
      const SIZE = 4;
      const boardEl = document.getElementById("board");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const undoBtn = document.getElementById("undo");
      const message = document.getElementById("message");
      const messageTitle = document.getElementById("messageTitle");
      const messageText = document.getElementById("messageText");
      let grid, score, best, previous, won, keepPlaying;

      try { best = Number(localStorage.getItem("gz203_2048_best")) || 0; }
      catch (_) { best = 0; }
      bestEl.textContent = best;

      function emptyGrid() { return Array.from({ length: SIZE }, () => Array(SIZE).fill(0)); }
      function snapshot() { return { grid: grid.map(row => row.slice()), score, won, keepPlaying }; }
      function saveBest() {
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          try { localStorage.setItem("gz203_2048_best", String(best)); } catch (_) {}
        }
      }
      function addTile() {
        const empty = [];
        for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (!grid[r][c]) empty.push([r,c]);
        if (!empty.length) return;
        const [r,c] = empty[Math.floor(Math.random() * empty.length)];
        grid[r][c] = Math.random() < 0.9 ? 2 : 4;
      }
      function startGame() {
        grid = emptyGrid(); score = 0; previous = null; won = false; keepPlaying = false;
        addTile(); addTile(); hideMessage(); render();
      }
      function hideMessage() { message.classList.remove("show"); }
      function showMessage(title, text, buttonText) {
        messageTitle.textContent = title;
        messageText.textContent = text;
        document.getElementById("messageButton").textContent = buttonText;
        message.classList.add("show");
      }
      function render() {
        [...boardEl.querySelectorAll(".cell")].forEach(el => el.remove());
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const value = grid[r][c];
            const cell = document.createElement("div");
            cell.className = "cell";
            if (value) {
              cell.textContent = value;
              cell.classList.add(value <= 2048 ? "v" + value : "vhigh");
              cell.setAttribute("aria-label", String(value));
            } else {
              cell.setAttribute("aria-label", "empty");
            }
            boardEl.insertBefore(cell, message);
          }
        }
        scoreEl.textContent = score;
        undoBtn.disabled = !previous;
        if (!won && grid.some(row => row.includes(2048))) {
          won = true;
          showMessage("You Win!", "You made the 2048 tile. Keep playing or start a new game.", "Keep Playing");
        } else if (!canMove()) {
          showMessage("Game Over", "No more moves available. Give it another try!", "Try Again");
        }
      }
      function canMove() {
        for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
          if (!grid[r][c]) return true;
          if (c < SIZE - 1 && grid[r][c] === grid[r][c+1]) return true;
          if (r < SIZE - 1 && grid[r][c] === grid[r+1][c]) return true;
        }
        return false;
      }
      function move(direction) {
        if (message.classList.contains("show")) return;
        const before = snapshot();
        let changed = false, gained = 0;
        const next = emptyGrid();
        for (let i = 0; i < SIZE; i++) {
          let line = [];
          for (let j = 0; j < SIZE; j++) {
            const r = direction === "up" ? j : direction === "down" ? SIZE - 1 - j : i;
            const c = direction === "left" ? j : direction === "right" ? SIZE - 1 - j : i;
            line.push(grid[r][c]);
          }
          const compact = line.filter(Boolean);
          const merged = [];
          for (let k = 0; k < compact.length; k++) {
            if (compact[k] === compact[k+1]) {
              const value = compact[k] * 2;
              merged.push(value); gained += value; k++;
            } else merged.push(compact[k]);
          }
          while (merged.length < SIZE) merged.push(0);
          for (let j = 0; j < SIZE; j++) {
            const r = direction === "up" ? j : direction === "down" ? SIZE - 1 - j : i;
            const c = direction === "left" ? j : direction === "right" ? SIZE - 1 - j : i;
            next[r][c] = merged[j];
            if (next[r][c] !== grid[r][c]) changed = true;
          }
        }
        if (!changed) return;
        previous = before;
        grid = next; score += gained; addTile(); saveBest(); render();
      }
      function undo() {
        if (!previous) return;
        const old = previous;
        grid = old.grid.map(row => row.slice()); score = old.score;
        won = old.won; keepPlaying = old.keepPlaying; previous = null;
        hideMessage(); render();
      }
      
      // Keyboard Controls
      document.addEventListener("keydown", e => {
        const keys = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" };
        if (keys[e.key]) { e.preventDefault(); move(keys[e.key]); }
      });

      // Touch & Mouse Swipe Controls
      let startX = 0, startY = 0;
      
      boardEl.addEventListener("touchstart", e => {
        const t = e.changedTouches[0]; startX = t.clientX; startY = t.clientY;
      }, { passive: true });

      boardEl.addEventListener("touchend", e => {
        const t = e.changedTouches[0], dx = t.clientX - startX, dy = t.clientY - startY;
        handleSwipe(dx, dy);
      }, { passive: true });
      
      // Mouse Drag Support
      boardEl.addEventListener("mousedown", e => {
        startX = e.clientX; startY = e.clientY;
      });
      boardEl.addEventListener("mouseup", e => {
        const dx = e.clientX - startX, dy = e.clientY - startY;
        handleSwipe(dx, dy);
      });

      function handleSwipe(dx, dy) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
        move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
      }

      document.getElementById("newGame").addEventListener("click", startGame);
      undoBtn.addEventListener("click", undo);
      document.getElementById("messageButton").addEventListener("click", () => {
        if (won && !keepPlaying) { keepPlaying = true; hideMessage(); }
        else startGame();
      });
      startGame();
    })();
  </script>
</body>
</html>
