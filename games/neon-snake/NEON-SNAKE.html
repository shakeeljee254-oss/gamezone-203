<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;background:#080b18;color:white;
 font-family:Arial, sans-serif;
 display:flex;justify-content:center;align-items:center;
 padding:10px; overflow:hidden;
}
.game-wrapper {
 display: flex; gap: 20px; align-items: flex-start;
 flex-direction: row;
}
.sidebar {
 display: flex; flex-direction: column; gap: 10px;
 width: 140px;
}
.stats {
 background:#151c35; padding:12px; border-radius:12px; border:1px solid #493b85;
 text-align:center; font-size: 12px; color: #aab1ce; font-weight: bold;
}
.stats strong { display: block; color:#50f5d0; font-size:24px; margin-top:4px; }
button {
 background:linear-gradient(90deg,#7045ee,#a855f7);
 color:white; border:0; padding:12px; border-radius:10px;
 font-weight:bold; font-size:14px; cursor:pointer;
 transition: transform 0.1s;
}
button:active { transform:scale(.95); }
.secondary-btn { background: #2a3151; color: #aab1ce; }
canvas {
 background:#080e1c; border:2px solid #7045ee; border-radius:12px;
 touch-action:none; display: block;
 box-shadow: 0 0 30px rgba(112, 69, 238, 0.2);
 max-width: 100%; max-height: 85vh; aspect-ratio: 1;
}
.mobile-controls {
 display: none; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px;
}
.mobile-controls button { padding: 15px; font-size: 20px; }
.header { text-align: center; margin-bottom: 15px; }
.header h1 { color:#a78bfa; font-size:24px; margin:0 0 5px; letter-spacing: 1px; }
.header p { color:#aab1ce; font-size:12px; margin:0; }

/* Mobile Setup */
@media(max-width: 650px) {
 .game-wrapper { flex-direction: column; align-items: center; width: 100%; }
 .sidebar { flex-direction: row; width: 100%; max-width: 400px; justify-content: space-between; margin-bottom: 10px; }
 .stats { flex: 1; padding: 8px; }
 .stats strong { font-size: 18px; }
 .sidebar button { flex: 1; padding: 10px 5px; font-size: 12px; }
 .mobile-controls { display: grid; width: 100%; max-width: 300px; }
 canvas { max-width: 95vw; }
}
</style>
</head>
<body>

<div>
 <div class="header">
  <h1>🐍 NEON SNAKE</h1>
  <p>Eat the food. Grow your snake. Don't bite yourself!</p>
 </div>

 <div class="game-wrapper">
  <!-- Sidebar (Stats and Buttons) -->
  <div class="sidebar">
   <div class="stats">SCORE<strong id="score">0</strong></div>
   <div class="stats">BEST<strong id="best">0</strong></div>
   <button id="start">START GAME</button>
   <button id="pause" class="secondary-btn" disabled>⏸ PAUSE</button>
   <button id="restart" class="secondary-btn">↻ RESTART</button>
  </div>

  <!-- Game Canvas -->
  <canvas id="game" width="400" height="400"></canvas>
 </div>

 <!-- Mobile Controls -->
 <div class="mobile-controls">
  <div></div>
  <button onmousedown="turn(0,-1); return false;" ontouchstart="turn(0,-1); return false;">⬆️</button>
  <div></div>
  <button onmousedown="turn(-1,0); return false;" ontouchstart="turn(-1,0); return false;">⬅️</button>
  <button onmousedown="turn(0,1); return false;" ontouchstart="turn(0,1); return false;">⬇️</button>
  <button onmousedown="turn(1,0); return false;" ontouchstart="turn(1,0); return false;">➡️</button>
 </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const startBtn=document.getElementById("start");
const pauseBtn=document.getElementById("pause");

// Game variables
const gridSize = 20;
const tileCount = canvas.width / gridSize;

let snake, food, dx, dy, score, best, playing, loop, paused = false;

// Load Best Score
best = Number(localStorage.getItem("neonSnakeBest") || 0);
bestEl.textContent = best;

function reset() {
 clearInterval(loop);
 // Start snake in the middle
 snake = [
  {x: 10, y: 10},
  {x: 9, y: 10},
  {x: 8, y: 10}
 ];
 dx = 1; dy = 0; score = 0; playing = false; paused = false;
 placeFood();
 scoreEl.textContent = 0;
 startBtn.textContent = "START GAME";
 pauseBtn.textContent = "⏸ PAUSE";
 pauseBtn.disabled = true;
 draw();
}

function startGame() {
 if(playing) return;
 if(paused) { togglePause(); return; } // Resume if paused

 playing = true;
 startBtn.textContent = "PLAYING...";
 pauseBtn.disabled = false;
 loop = setInterval(update, 100); // Speed
}

function placeFood() {
 do {
  food = {
   x: Math.floor(Math.random() * tileCount),
   y: Math.floor(Math.random() * tileCount)
  };
 } while(snake.some(s => s.x === food.x && s.y === food.y));
}

function draw() {
 // Clear board
 ctx.fillStyle = "#080e1c";
 ctx.fillRect(0, 0, canvas.width, canvas.height);

 // Draw grid lines
 ctx.strokeStyle = "#151c35";
 for(let i = 0; i <= canvas.width; i += gridSize) {
  ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
 }

 // Draw Food (Glowing Red)
 ctx.shadowBlur = 15;
 ctx.shadowColor = "#ff4d79";
 ctx.fillStyle = "#ff4d79";
 ctx.beginPath();
 ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
 ctx.fill();

 // Draw Snake (Fancy Rounded Glowing)
 snake.forEach((s, i) => {
  const isHead = i === 0;
  ctx.shadowBlur = isHead ? 20 : 10;
  ctx.shadowColor = "#50f5d0";
  ctx.fillStyle = isHead ? "#b0fff0" : "#24cda9";
  
  // Rounded rectangle logic
  const x = s.x * gridSize + 1;
  const y = s.y * gridSize + 1;
  const w = gridSize - 2;
  const r = isHead ? 8 : 6; // Head is more rounded
  
  ctx.beginPath();
  ctx.roundRect(x, y, w, w, r);
  ctx.fill();
 });
 ctx.shadowBlur = 0; // Reset shadow
}

function turn(x, y) {
 if(!playing || paused) return;
 if(x === -dx && y === -dy) return; // Prevent 180 degree turn
 dx = x; dy = y;
}

function endGame() {
 playing = false;
 clearInterval(loop);
 startBtn.textContent = "GAME OVER";
 pauseBtn.disabled = true;
 
 // Flash red on game over
 ctx.fillStyle = "rgba(255, 0, 0, 0.2)";
 ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function update() {
 // Calculate next head position
 const head = {x: snake[0].x + dx, y: snake[0].y + dy};

 // WALL WRAP LOGIC (Snake passes through walls)
 if(head.x < 0) head.x = tileCount - 1;
 if(head.x >= tileCount) head.x = 0;
 if(head.y < 0) head.y = tileCount - 1;
 if(head.y >= tileCount) head.y = 0;

 const eating = head.x === food.x && head.y === food.y;
 const body = eating ? snake : snake.slice(0, -1);

 // SELF COLLISION LOGIC
 if(body.some(s => s.x === head.x && s.y === head.y)) {
  endGame();
  return;
 }

 snake.unshift(head);

 if(eating) {
  score += 10;
  scoreEl.textContent = score;
  if(score > best) {
   best = score;
   bestEl.textContent = best;
   localStorage.setItem("neonSnakeBest", best);
  }
  placeFood();
 } else {
  snake.pop();
 }

 draw();
}

function togglePause() {
 if(!playing) return;
 if(!paused) {
  clearInterval(loop);
  paused = true;
  pauseBtn.textContent = "▶ RESUME";
  startBtn.textContent = "PAUSED";
 } else {
  paused = false;
  pauseBtn.textContent = "⏸ PAUSE";
  startBtn.textContent = "PLAYING...";
  loop = setInterval(update, 100);
 }
}

// --- Event Listeners ---
startBtn.onclick = startGame;
document.getElementById("restart").onclick = () => { reset(); startGame(); };
pauseBtn.onclick = togglePause;

// Keyboard
document.addEventListener("keydown", e => {
 const keys = {
  ArrowUp:[0,-1], w:[0,-1], W:[0,-1],
  ArrowDown:[0,1], s:[0,1], S:[0,1],
  ArrowLeft:[-1,0], a:[-1,0], A:[-1,0],
  ArrowRight:[1,0], d:[1,0], D:[1,0]
 };
 if(keys[e.key]) {
  e.preventDefault();
  turn(...keys[e.key]);
 }
});

// Touch Swipe (Mobile)
let touchX = 0, touchY = 0;
canvas.addEventListener("touchstart", e => {
 touchX = e.touches[0].clientX;
 touchY = e.touches[0].clientY;
}, {passive: true});

canvas.addEventListener("touchend", e => {
 const x = e.changedTouches[0].clientX - touchX;
 const y = e.changedTouches[0].clientY - touchY;
 if(Math.max(Math.abs(x), Math.abs(y)) < 20) return;
 if(Math.abs(x) > Math.abs(y)) {
  turn(x > 0 ? 1 : -1, 0);
 } else {
  turn(0, y > 0 ? 1 : -1);
 }
}, {passive: true});

// Init
reset();
</script>
</body>
</html>
