
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Snake - GameZone 203</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;min-height:100vh;background:#080b18;color:white;
 font-family:Arial,sans-serif;text-align:center;
 display:flex;align-items:center;flex-direction:column;
 padding:8px 12px;
}

h1{color:#a78bfa;font-size:26px;margin:2px 0 5px}
p{color:#aab1ce;font-size:13px;margin:3px 0 8px}

.panel{
 background:#151c35;padding:12px;border-radius:18px;
 border:1px solid #493b85;width:100%;max-width:380px;
}

.stats{display:flex;justify-content:space-around;margin-bottom:8px}
.stats strong{color:#50f5d0;font-size:21px;display:block;margin-top:3px}

canvas{
 width:100%;max-width:300px;aspect-ratio:1;
 background:#080e1c;border:2px solid #7045ee;
 border-radius:12px;display:block;margin:auto;
 touch-action:none;
}

h3{font-size:16px;margin:10px 0}

button{
 background:linear-gradient(90deg,#7045ee,#a855f7);
 color:white;border:0;padding:10px 18px;
 border-radius:10px;font-weight:bold;font-size:14px;
 cursor:pointer;margin:5px 4px;
}

button:active{transform:scale(.95)}

.controls{
 display:grid;grid-template-columns:repeat(3,45px);
 justify-content:center;gap:5px;margin-top:7px;
}

.controls button{margin:0;padding:8px;font-size:18px}
.info{font-size:12px;color:#aab1ce;margin-top:9px}

@media(max-width:480px){
 .panel{max-width:100%}
 canvas{max-width:100%}
}
</style>
</head>

<body>

<h1>🐍 NEON SNAKE</h1>
<p>Eat the food. Grow your snake. Beat your record!</p>

<div class="panel">

 <div class="stats">
  <div>SCORE<strong id="score">0</strong></div>
  <div>BEST<strong id="best">0</strong></div>
 </div>

 <canvas id="game" width="400" height="400"></canvas>

 <h3 id="message">Press START to Play!</h3>

 <button id="start">START GAME</button>
 <button id="restart">RESTART</button>
 <button id="pause">⏸ PAUSE</button>

 <div class="controls">
  <span></span>
  <button onclick="turn(0,-1)">⬆️</button>
  <span></span>

  <button onclick="turn(-1,0)">⬅️</button>
  <button onclick="turn(0,1)">⬇️</button>
  <button onclick="turn(1,0)">➡️</button>
 </div>

 <div class="info">
  Use Arrow Keys or WASD to move.<br>
  Mobile: Swipe or use the buttons.
 </div>

</div>

<p>© GameZone 203</p>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const msg=document.getElementById("message");
const pauseBtn=document.getElementById("pause");

const size=20;

let snake,food,dx,dy,score,best,playing,loop,paused=false;

best=Number(localStorage.getItem("snakeBest")||0);
bestEl.textContent=best;


// RESET GAME
function reset(){

 clearInterval(loop);

 snake=[
  {x:10,y:10},
  {x:9,y:10},
  {x:8,y:10}
 ];

 dx=1;
 dy=0;

 score=0;
 playing=false;
 paused=false;

 placeFood();

 scoreEl.textContent=0;
 msg.textContent="Press START to Play!";
 pauseBtn.textContent="⏸ PAUSE";

 draw();
}


// START GAME
function startGame(){

 if(playing)return;

 if(msg.textContent.includes("GAME OVER")){
  reset();
 }

 playing=true;
 paused=false;

 msg.textContent="Good Luck! 🎮";

 loop=setInterval(update,120);
}


// PLACE FOOD
function placeFood(){

 do{
  food={
   x:Math.floor(Math.random()*20),
   y:Math.floor(Math.random()*20)
  };
 }while(snake.some(s=>s.x===food.x&&s.y===food.y));

}


// DRAW GAME
function draw(){

 ctx.fillStyle="#080e1c";
 ctx.fillRect(0,0,400,400);

 ctx.strokeStyle="#18213b";

 for(let i=0;i<=400;i+=20){

  ctx.beginPath();
  ctx.moveTo(i,0);
  ctx.lineTo(i,400);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0,i);
  ctx.lineTo(400,i);
  ctx.stroke();

 }

 // FOOD
 ctx.shadowBlur=18;
 ctx.shadowColor="#ff4d79";
 ctx.fillStyle="#ff4d79";

 ctx.beginPath();
 ctx.arc(food.x*20+10,food.y*20+10,8,0,Math.PI*2);
 ctx.fill();

 // SNAKE
 snake.forEach((s,i)=>{

  ctx.shadowColor="#50f5d0";
  ctx.shadowBlur=15;

  ctx.fillStyle=i===0?"#b0fff0":"#24cda9";

  ctx.fillRect(s.x*20+2,s.y*20+2,16,16);

 });

 ctx.shadowBlur=0;

}


// CHANGE DIRECTION
function turn(x,y){

 if(!playing||paused)return;

 if(x===-dx&&y===-dy)return;

 dx=x;
 dy=y;

}


// GAME OVER
function endGame(){

 playing=false;
 paused=false;

 clearInterval(loop);

 msg.textContent="GAME OVER! Score: "+score;
 pauseBtn.textContent="⏸ PAUSE";

}


// UPDATE GAME
function update(){

 const head={
  x:snake[0].x+dx,
  y:snake[0].y+dy
 };

 // WALL COLLISION
 if(head.x<0||head.x>=20||head.y<0||head.y>=20){
  endGame();
  return;
 }

 const eating=head.x===food.x&&head.y===food.y;

 const body=eating?snake:snake.slice(0,-1);

 // SNAKE COLLISION
 if(body.some(s=>s.x===head.x&&s.y===head.y)){
  endGame();
  return;
 }

 snake.unshift(head);

 // EAT FOOD
 if(eating){

  score+=10;
  scoreEl.textContent=score;

  if(score>best){

   best=score;
   bestEl.textContent=best;

   localStorage.setItem("snakeBest",best);

  }

  placeFood();

 }else{

  snake.pop();

 }

 draw();

}


// PAUSE AND RESUME
function togglePause(){

 if(!playing)return;

 if(!paused){

  clearInterval(loop);

  paused=true;

  msg.textContent="GAME PAUSED ⏸";
  pauseBtn.textContent="▶ RESUME";

 }else{

  paused=false;

  msg.textContent="Good Luck! 🎮";
  pauseBtn.textContent="⏸ PAUSE";

  loop=setInterval(update,120);

 }

}


// PAUSE BUTTON
pauseBtn.onclick=togglePause;


// KEYBOARD CONTROLS
document.addEventListener("keydown",e=>{

 const keys={

  ArrowUp:[0,-1],
  w:[0,-1],
  W:[0,-1],

  ArrowDown:[0,1],
  s:[0,1],
  S:[0,1],

  ArrowLeft:[-1,0],
  a:[-1,0],
  A:[-1,0],

  ArrowRight:[1,0],
  d:[1,0],
  D:[1,0]

 };

 if(keys[e.key]){

  e.preventDefault();

  turn(...keys[e.key]);

 }

});


// MOBILE SWIPE CONTROLS
let touchX=0,touchY=0;

canvas.addEventListener("touchstart",e=>{

 touchX=e.touches[0].clientX;
 touchY=e.touches[0].clientY;

},{passive:true});


canvas.addEventListener("touchend",e=>{

 const x=e.changedTouches[0].clientX-touchX;
 const y=e.changedTouches[0].clientY-touchY;

 if(Math.max(Math.abs(x),Math.abs(y))<15)return;

 if(Math.abs(x)>Math.abs(y)){

  turn(x>0?1:-1,0);

 }else{

  turn(0,y>0?1:-1);

 }

},{passive:true});


// START BUTTON
document.getElementById("start").onclick=startGame;


// RESTART BUTTON
document.getElementById("restart").onclick=()=>{

 reset();
 startGame();

};


// INITIAL GAME SETUP
reset();

</script>

</body>
</html>
