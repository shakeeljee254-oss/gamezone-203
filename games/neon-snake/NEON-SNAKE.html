<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<!-- SEO TAGS -->

<link rel="canonical" href="https://shakeeljee254-oss.github.io/gamezone-203/games/neon-snake/NEON-SNAKE.html">
<meta property="og:title" content="Neon Snake - Play Free Online | GameZone 203">

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;background:#080b18;color:white;
 font-family:Arial, sans-serif;
 display:flex;justify-content:center;align-items:center;
 padding:15px; overflow:hidden;
}
.game-container {
 width: 100%;
 max-width: 1000px; /* Poori screen cover karega */
 display: flex;
 gap: 20px;
 justify-content: center;
 align-items: flex-start;
}
/* Sidebar (Buttons left side me) */
.sidebar {
 display: flex; flex-direction: column; gap: 12px;
 width: 160px; flex-shrink: 0;
}
.stats {
 background:#151c35; padding:15px; border-radius:12px; border:1px solid #493b85;
 text-align:center; font-size: 13px; color: #aab1ce; font-weight: bold;
}
.stats strong { display: block; color:#50f5d0; font-size:28px; margin-top:5px; }
button {
 background:linear-gradient(90deg,#7045ee,#a855f7);
 color:white; border:0; padding:14px; border-radius:10px;
 font-weight:bold; font-size:14px; cursor:pointer;
 transition: transform 0.1s; width: 100%;
}
button:active { transform:scale(.95); }
.secondary-btn { background: #2a3151; color: #aab1ce; }
button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* Game Area */
.game-area { flex-grow: 1; display: flex; justify-content: center; }
canvas {
 background:#080e1c; border:2px solid #7045ee; border-radius:12px;
 touch-action:none; display: block;
 box-shadow: 0 0 30px rgba(112, 69, 238, 0.2);
 width: 100%; max-width: 600px; aspect-ratio: 1;
}

/* Mobile controls hide by default */
.mobile-controls { display: none; }

/* Mobile Setup */
@media(max-width: 768px) {
 .game-container { flex-direction: row; gap: 10px; align-items: stretch; }
 .sidebar { width: 100px; gap: 8px; }
 .stats { padding: 8px; font-size: 10px; }
 .stats strong { font-size: 18px; }
 button { padding: 10px 5px; font-size: 11px; }
 canvas { width: 100%; height: 100%; object-fit: contain; }
}
@media(max-width: 400px) {
 /* Agar phone bohot chhota ho to buttons upar aa jayenge */
 .game-container { flex-direction: column; align-items: center; }
 .sidebar { flex-direction: row; width: 100%; flex-wrap: wrap; justify-content: center; }
 .stats { flex: 1; }
 button { flex: 1; padding: 10px; }
 .game-area { width: 100%; }
}
</style>
</head>
<body>

<div class="game-container">
 <!-- Left Side: Score and Buttons -->
 <div class="sidebar">
  <div class="stats">SCORE<strong id="score">0</strong></div>
  <div class="stats">BEST<strong id="best">0</strong></div>
  <button id="start">START GAME</button>
  <button id="pause" class="secondary-btn" disabled>⏸ PAUSE</button>
  <button id="restart" class="secondary-btn">↻ RESTART</button>
 </div>

 <!-- Right Side: Game Canvas -->
 <div class="game-area">
  <canvas id="game" width="400" height="400"></canvas>
 </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const startBtn=document.getElementById("start");
const pauseBtn=document.getElementById("pause");

const gridSize = 20;
const tileCount = canvas.width / gridSize;

let snake, food, dx, dy, score, best, playing, loop, paused = false;

best = Number(localStorage.getItem("neonSnakeBest") || 0);
bestEl.textContent = best;

function reset() {
 clearInterval(loop);
 snake = [{x: 10, y: 10},{x: 9, y: 10},{x: 8, y: 10}];
 dx = 1; dy = 0; score = 0; playing = false; paused = false;
 placeFood();
 scoreEl.textContent = 0;
 startBtn.textContent = "START GAME";
 startBtn.disabled = false;
 pauseBtn.textContent = "⏸ PAUSE";
 pauseBtn.disabled = true;
 draw();
}

function startGame() {
 if(playing) return;
 if(paused) { togglePause(); return; }
 playing = true;
 startBtn.textContent = "PLAYING...";
 startBtn.disabled = true;
 pauseBtn.disabled = false;
 loop = setInterval(update, 100);
}

function placeFood() {
 do {
  food = { x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount) };
 } while(snake.some(s => s.x === food.x && s.y === food.y));
}

function draw() {
 ctx.fillStyle = "#080e1c";
 ctx.fillRect(0, 0, canvas.width, canvas.height);

 ctx.strokeStyle = "#151c35";
 for(let i = 0; i <= canvas.width; i += gridSize) {
  ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
 }

 // Food (Red Glowing Dot)
 ctx.shadowBlur = 15; ctx.shadowColor = "#ff4d79"; ctx.fillStyle = "#ff4d79";
 ctx.beginPath();
 ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
 ctx.fill();

 // Snake (Rounded Glowing)
 snake.forEach((s, i) => {
  const isHead = i === 0;
  ctx.shadowBlur = isHead ? 20 : 10;
  ctx.shadowColor = "#50f5d0";
  ctx.fillStyle = isHead ? "#ffffff" : "#50f5d0"; // Head white, body cyan
  
  ctx.beginPath();
  // Gol (Circle) shape banaya hai
  ctx.arc(s.x * gridSize + gridSize/2, s.y * gridSize + gridSize/2, gridSize/2 - 1, 0, Math.PI * 2);
  ctx.fill();
 });
 ctx.shadowBlur = 0;
}

function turn(x, y) {
 if(!playing || paused) return;
 if(x === -dx && y === -dy) return;
 dx = x; dy = y;
}

function endGame() {
 playing = false; clearInterval(loop);
 startBtn.textContent = "GAME OVER";
 startBtn.disabled = false;
 pauseBtn.disabled = true;
}

function update() {
 const head = {x: snake[0].x + dx, y: snake[0].y + dy};

 if(head.x < 0) head.x = tileCount - 1;
 if(head.x >= tileCount) head.x = 0;
 if(head.y < 0) head.y = tileCount - 1;
 if(head.y >= tileCount) head.y = 0;

 const eating = head.x === food.x && head.y === food.y;
 const body = eating ? snake : snake.slice(0, -1);

 if(body.some(s => s.x === head.x && s.y === head.y)) {
  endGame();
  return;
 }

 snake.unshift(head);

 if(eating) {
  score += 10;
  scoreEl.textContent = score;
  if(score > best) {
   best = score; bestEl.textContent = best;
   localStorage.setItem("neonSnakeBest", best);
  }
  placeFood();
 } else { snake.pop(); }
 draw();
}

function togglePause() {
 if(!playing && !paused) return;
 if(!paused) {
  clearInterval(loop); paused = true;
  pauseBtn.textContent = "▶ RESUME";
  startBtn.textContent = "PAUSED";
 } else {
  paused = false;
  pauseBtn.textContent = "⏸ PAUSE";
  startBtn.textContent = "PLAYING...";
  loop = setInterval(update, 100);
 }
}

startBtn.onclick = startGame;
document.getElementById("restart").onclick = () => { reset(); startGame(); };
pauseBtn.onclick = togglePause;

document.addEventListener("keydown", e => {
 const keys = {
  ArrowUp:[0,-1], w:[0,-1], W:[0,-1],
  ArrowDown:[0,1], s:[0,1], S:[0,1],
  ArrowLeft:[-1,0], a:[-1,0], A:[-1,0],
  ArrowRight:[1,0], d:[1,0], D:[1,0]
 };
 if(keys[e.key]) { e.preventDefault(); turn(...keys[e.key]); }
});

let touchX = 0, touchY = 0;
canvas.addEventListener("touchstart", e => {
 touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
}, {passive: true});

canvas.addEventListener("touchend", e => {
 const x = e.changedTouches[0].clientX - touchX;
 const y = e.changedTouches[0].clientY - touchY;
 if(Math.max(Math.abs(x), Math.abs(y)) < 20) return;
 if(Math.abs(x) > Math.abs(y)) { turn(x > 0 ? 1 : -1, 0); } 
 else { turn(0, y > 0 ? 1 : -1); }
}, {passive: true});

reset();
</script>
</body>
</html>
