<script>
'use strict';
/* ===== Metro Rush 3D · GameZone 203 ===== */
const $=s=>document.querySelector(s),rnd=n=>Math.floor(Math.random()*n);
const LW=2.2,LANES=[-LW,0,LW],TL=24,NT=9;

/* ---- Declare state vars FIRST to avoid TDZ ---- */
let M={},NP,pPos,pVel,pLife,PS;
let R,scene,cam,sun,hemi,state='boot',T=0,G=null,pw={},P={lane:1,x:0,y:0,vy:0,sl:0},obs=[],coins=[],picks=[],tiles=[],dayT=0,menuT=2,shopTab='chars',curP='',from='',lastCS=0,tick=0;
const lk=new THREE.Vector3(),camP=new THREE.Vector3(),lkT=new THREE.Vector3();
const BX=new THREE.BoxGeometry(1,1,1),CYG=new THREE.CylinderGeometry(1,1,1,8),CNG=new THREE.ConeGeometry(1,1,7);let COING,PLG,PLT,TOR;
const MC={};function mat(c,e){const k=c+'|'+(e||'');return MC[k]||(MC[k]=new THREE.MeshStandardMaterial({color:c,roughness:.75,metalness:.1,emissive:e||0x000000}))}
function box(w,h,d,m,x,y,z,par,cs){const o=new THREE.Mesh(BX,m);o.scale.set(w,h,d);o.position.set(x,y,z);o.castShadow=!!cs;if(par)par.add(o);return o}
function cyl(r,h,m,x,y,z,par){const o=new THREE.Mesh(CYG,m);o.scale.set(r,h,r);o.position.set(x,y,z);par.add(o);return o}
function ctex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}

/* ---- Data ---- */
const CH=[
{n:'Kai',d:'Cap and backpack. The classic.',p:0,shirt:'#ff7a00',pants:'#2a3f8f',skin:'#e0a97a',hat:'#ffd400',cap:1,acc:'pack',ac:'#1a1a1a'},
{n:'Mira',d:'Beanie and neon scarf.',p:300,shirt:'#19d3c5',pants:'#5b2a86',skin:'#8d5a3b',hat:'#111827',acc:'scarf',ac:'#ff4d8d'},
{n:'Zed',d:'Spiky hair, cyber visor.',p:600,shirt:'#2b2b3a',pants:'#0e7490',skin:'#f1c9a0',hat:'#ff2e63',acc:'visor',ac:'#00e5ff'},
{n:'Luna',d:'Violet cape for night runs.',p:1000,shirt:'#f2f2f7',pants:'#ff4d8d',skin:'#c68a62',hat:'#7a3cff',acc:'cape',ac:'#7a3cff'},
{n:'Rex',d:'Wide-brim hat, red pack.',p:1500,shirt:'#3aa655',pants:'#5a3d1e',skin:'#a86f4a',hat:'#8b5a2b',brim:1,acc:'pack',ac:'#c0392b'}];
const BD=[{n:'Spark',c:'#ffd400',g:'#ff7a00',p:0},{n:'Neon',c:'#19d3c5',g:'#ff4d8d',p:250},{n:'Magma',c:'#ff4155',g:'#ffb21a',p:600},{n:'Aurora',c:'#7a3cff',g:'#19d3c5',p:1200}];
const PU={mag:['🧲','Magnet',10,0x19d3c5],jet:['🚀','Jetpack',6,0xff4155],snk:['👟','Super sneakers',10,0x4cd964],x2:['✖2','2× score',10,0xffb21a],hov:['🛹','Hoverboard',20,0x7a3cff],shd:['🛡️','Shield',12,0x3b82f6],boost:['⚡','Speed boost',5,0xffe066]};
const MS=[
{id:'d1',s:'d',t:'coins',g:100,r:80,n:'Collect 100 coins today'},{id:'d2',s:'d',t:'dist',g:1500,r:100,n:'Run 1500 m today'},{id:'d3',s:'d',t:'score',g:4000,r:120,n:'Score 4000 in one run'},
{id:'w1',s:'w',t:'dist',g:10000,r:500,n:'Run 10,000 m this week'},{id:'w2',s:'w',t:'coins',g:800,r:450,n:'Collect 800 coins this week'},{id:'w3',s:'w',t:'pow',g:25,r:400,n:'Grab 25 power-ups this week'},
{id:'a1',s:'a',t:'dist',g:5000,r:300,n:'Marathoner: 5 km in total'},{id:'a2',s:'a',t:'jump',g:200,r:200,n:'Hopper: 200 jumps'},{id:'a3',s:'a',t:'score',g:20000,r:500,n:'High roller: 20,000 in one run'},{id:'a4',s:'a',t:'coins',g:1000,r:400,n:'Collector: 1000 coins'}];
const DR=[50,100,150,200,300,400,600];

/* ---- Save system ---- */
const D={coins:0,best:0,dist:0,tc:0,runs:0,xp:0,up:0,chars:[0],ch:0,boards:[0],bd:0,mu:1,sf:1,mv:.5,sv:.8,q:2,cam:1,ms:{},mk:{d:0,w:0},daily:0,streak:0,scores:[]};
function loadS(){
  let o={};try{o=JSON.parse(localStorage.getItem('mr3d'))||{}}catch(e){}
  const s=JSON.parse(JSON.stringify(D));
  for(const k in s){
    const v=o[k];
    if(v!==undefined&&v!==null&&typeof v===typeof s[k]&&Array.isArray(v)===Array.isArray(s[k]))s[k]=v;
  }
  ['coins','best','dist','tc','runs','xp','up','daily','streak'].forEach(k=>{if(!isFinite(s[k])||s[k]<0)s[k]=0});
  if(!Array.isArray(s.chars))s.chars=[0];
  if(!Array.isArray(s.boards))s.boards=[0];
  if(!Array.isArray(s.scores))s.scores=[];
  if(!s.mk||typeof s.mk!=='object')s.mk={d:0,w:0};
  if(!s.ms||typeof s.ms!=='object')s.ms={};
  s.chars=s.chars.filter(i=>CH[i]);
  s.boards=s.boards.filter(i=>BD[i]);
  if(!s.chars.includes(0))s.chars.push(0);
  if(!s.boards.includes(0))s.boards.push(0);
  if(!s.chars.includes(s.ch))s.ch=0;
  if(!s.boards.includes(s.bd))s.bd=0;
  if(![0,1,2].includes(s.q))s.q=2;
  s.up=Math.min(5,Math.max(0,s.up));
  s.scores=s.scores.filter(x=>x&&isFinite(x.s)).slice(0,5);
  return s;
}
let S=loadS();
function save(){try{localStorage.setItem('mr3d',JSON.stringify(S))}catch(e){}}

/* ---- Audio ---- */
let AC,mG,sG,audioLoopStarted=false;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    mG=AC.createGain();sG=AC.createGain();
    mG.connect(AC.destination);sG.connect(AC.destination);
    applyVol();
    if(!audioLoopStarted){
      audioLoopStarted=true;
      const N=[220,262,330,392,330,262,294,349,440,349,294,262];let i=0;
      setInterval(()=>{
        if(document.hidden||!AC)return;
        const f=N[i%12];
        tone(f,.18,'triangle',.5,0,mG);
        if(i%4==0)tone(f/2,.35,'sine',.7,0,mG);
        i++;
      },220);
    }
  }catch(e){AC=null}
}
function applyVol(){if(!AC)return;mG.gain.value=S.mu?S.mv*.35:0;sG.gain.value=S.sf?S.sv:0}
function tone(f,d,ty,v,sl,out){
  if(!AC)return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=ty||'square';o.frequency.setValueAtTime(f,t);
  if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t+d);
  g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(out||sG);o.start(t);o.stop(t+d+.02);
}
const SND={
  click:()=>tone(660,.07,'square',.15),
  swish:()=>tone(500,.08,'sine',.12,300),
  jump:()=>tone(300,.18,'square',.2,500),
  slide:()=>tone(400,.2,'sawtooth',.12,-250),
  coin:()=>{tone(988,.08,'square',.12);setTimeout(()=>tone(1319,.12,'square',.12),60)},
  pow:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.12,'triangle',.25),i*70)),
  crash:()=>{tone(150,.5,'sawtooth',.4,-100);tone(80,.6,'square',.3,-40)},
  over:()=>[392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,.3,'triangle',.3),i*220)),
  step:()=>tone(90,.05,'triangle',.08)
};
const snd=n=>{try{SND[n]()}catch(e){}};

/* ---- Characters ---- */
function buildChar(d){
  const g=new THREE.Group(),m=c=>mat(c),u={};
  box(.6,.7,.35,m(d.shirt),0,1.05,0,g,1);
  box(.4,.4,.4,m(d.skin),0,1.6,0,g,1);
  box(.44,.16,.44,m(d.hat),0,1.85,0,g);
  if(d.cap)box(.4,.05,.25,m(d.hat),0,1.8,-.3,g);
  if(d.brim)box(.9,.05,.9,m(d.hat),0,1.78,0,g);
  const limb=(x,y,w,h,c)=>{const p=new THREE.Group();p.position.set(x,y,0);box(w,h,w,m(c),0,-h/2,0,p,1);g.add(p);return p};
  u.lL=limb(-.15,.7,.2,.7,d.pants);u.lR=limb(.15,.7,.2,.7,d.pants);
  u.aL=limb(-.4,1.35,.16,.6,d.skin);u.aR=limb(.4,1.35,.16,.6,d.skin);
  box(.22,.1,.3,m('#fff'),-.15,.05,-.05,g);box(.22,.1,.3,m('#fff'),.15,.05,-.05,g);
  if(d.acc==='pack')box(.45,.55,.25,m(d.ac),0,1.1,.3,g);
  if(d.acc==='scarf')box(.66,.14,.4,m(d.ac),0,1.4,0,g);
  if(d.acc==='visor')box(.42,.1,.06,mat(d.ac,d.ac),0,1.62,-.22,g);
  if(d.acc==='cape')box(.6,.9,.05,m(d.ac),0,1.0,.22,g);
  g.userData=u;return g;
}
function buildBoard(b){const g=new THREE.Group();box(.9,.08,1.8,mat(b.c),0,0,0,g);box(.8,.04,1.7,mat(b.g,b.g),0,-.06,0,g);return g}
function setChar(){if(P.c)P.g.remove(P.c);if(P.bm)P.g.remove(P.bm);P.c=buildChar(CH[S.ch]);P.g.add(P.c);P.bm=buildBoard(BD[S.bd]);P.bm.position.y=.02;P.g.add(P.bm)}
function pose(g,t,m){
  const u=g.userData;
  if(!u||!u.lL||!u.lR||!u.aL||!u.aR)return;
  const s=Math.sin(t*13)*.9;
  g.rotation.x=0;g.position.y=0;
  if(m==='jump'){u.lL.rotation.x=-.9;u.lR.rotation.x=.5;u.aL.rotation.x=u.aR.rotation.x=-2.4}
  else if(m==='slide'){g.rotation.x=1.15;g.position.y=.12;u.lL.rotation.x=u.lR.rotation.x=0;u.aL.rotation.x=u.aR.rotation.x=-1.2}
  else{u.lL.rotation.x=s;u.lR.rotation.x=-s;u.aL.rotation.x=-s;u.aR.rotation.x=s;g.position.y=Math.abs(Math.sin(t*13))*.06}
}

/* ---- World ---- */
function init3D(){
  R=new THREE.WebGLRenderer({canvas:$('#c'),antialias:S.q>0});
  R.shadowMap.enabled=true;
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x6ec6ff);
  scene.fog=new THREE.Fog(0x6ec6ff,30,140);
  cam=new THREE.PerspectiveCamera(60,1,.1,220);
  hemi=new THREE.HemisphereLight(0xffffff,0x334455,.8);scene.add(hemi);
  sun=new THREE.DirectionalLight(0xffffff,1);sun.position.set(6,14,8);
  sun.target.position.set(0,0,-6);scene.add(sun,sun.target);
  const sc=sun.shadow.camera;
  sc.left=-16;sc.right=16;sc.top=20;sc.bottom=-20;sc.near=1;sc.far=45;
  sun.shadow.mapSize.set(1024,1024);
  COING=new THREE.CylinderGeometry(.35,.35,.1,14);COING.rotateX(Math.PI/2);
  PLG=new THREE.PlaneGeometry(70,TL);
  PLT=new THREE.PlaneGeometry(LW*.95,TL);
  TOR=new THREE.TorusGeometry(.6,.05,6,18);
  const tt=ctex(128,128,(x,w,h)=>{
    x.fillStyle='#3b3a40';x.fillRect(0,0,w,h);
    for(let i=0;i<300;i++){x.fillStyle=i%2?'#4a4950':'#2d2c32';x.fillRect(rnd(w),rnd(h),3,3)}
    for(let y=0;y<4;y++){x.fillStyle='#5a3d28';x.fillRect(0,y*32+8,w,12)}
    x.fillStyle='#c9ced6';x.fillRect(30,0,6,h);x.fillRect(92,0,6,h);
  });
  tt.repeat.set(1,TL/4);
  const wt=ctex(64,128,(x,w,h)=>{
    x.fillStyle='#1b2240';x.fillRect(0,0,w,h);
    for(let a=0;a<8;a++)for(let b=0;b<16;b++){
      x.fillStyle=Math.random()<.55?'#ffd98a':'#2c3560';
      x.fillRect(6+a*7,6+b*7.5,4,4);
    }
  });
  M={
    track:new THREE.MeshStandardMaterial({map:tt,roughness:.9}),
    ground:mat('#2b3040'),
    gold:new THREE.MeshStandardMaterial({color:0xffc300,emissive:0x8a6000,metalness:.6,roughness:.3}),
    bld:['#8fa3c9','#c9a38f','#9fc9a3'].map(c=>new THREE.MeshStandardMaterial({map:wt,color:c,roughness:.8}))
  };
  for(let i=0;i<NT;i++){
    const g=new THREE.Group();
    const a=new THREE.Mesh(PLG,M.ground);
    a.rotation.x=-Math.PI/2;a.receiveShadow=true;g.add(a);
    LANES.forEach(x=>{
      const t=new THREE.Mesh(PLT,M.track);
      t.rotation.x=-Math.PI/2;t.position.set(x,.02,0);t.receiveShadow=true;g.add(t);
    });
    g.dec=new THREE.Group();g.add(g.dec);
    g.position.z=12-i*TL;g.idx=i;scene.add(g);tiles.push(g);
    decorate(g);
  }
  const ptx=Object.keys(PU).map(k=>{
    const c=document.createElement('canvas');c.width=c.height=96;
    const x=c.getContext('2d');
    x.fillStyle='rgba(11,16,38,.8)';x.beginPath();x.arc(48,48,44,0,7);x.fill();
    x.font='52px sans-serif';x.textAlign='center';x.textBaseline='middle';
    x.fillStyle='#fff';x.fillText(PU[k][0],48,52);
    return [k,new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c)})];
  });
  M.spr=Object.fromEntries(ptx);
  P.g=new THREE.Group();scene.add(P.g);setChar();
  P.jp=new THREE.Group();
  box(.4,.6,.2,mat('#888'),0,1.1,.35,P.jp);
  box(.25,.4,.1,mat('#ff7a00','#ff5500'),0,.7,.35,P.jp);
  P.jp.visible=false;P.g.add(P.jp);
  P.sh=new THREE.Mesh(new THREE.SphereGeometry(1.15,16,12),new THREE.MeshBasicMaterial({color:0x3b82f6,transparent:true,opacity:.28}));
  P.sh.position.y=.95;P.sh.visible=false;P.g.add(P.sh);
  NP=70;pPos=new Float32Array(NP*3).fill(-100);
  pVel=new Float32Array(NP*3);pLife=new Float32Array(NP);
  const pg=new THREE.BufferGeometry();
  pg.setAttribute('position',new THREE.BufferAttribute(pPos,3));
  PS=new THREE.Points(pg,new THREE.PointsMaterial({size:.28,color:0xffd400,transparent:true,depthWrite:false}));
  PS.frustumCulled=false;scene.add(PS);
  applyQ();
}
function decorate(t){
  const d=t.dec;
  while(d.children.length)d.remove(d.children[0]);
  t.idx=(t.idx||0);
  const n=++tick,dens=[.5,.8,1][S.q];
  [-1,1].forEach(s=>{
    if(n%7===0){
      box(5,.5,20,mat('#6b7390'),s*6.2,.25,0,d);
      box(5.4,.25,20,mat('#c9503d'),s*6.2,3.6,0,d);

  g.add(new THREE.Mesh(TOR,new THREE.MeshBasicMaterial({color:PU[k][3]})));

function spawnRow(){
  const z=-150,sp=G.speed,free=rnd(3),r=Math.random();
  let row=[null,null,null],hasT=false,tun=false;
  const low=()=>['bar','crate','road'][rnd(3)],each=(f)=>[0,1,2].forEach(f);
  if(G.t<4){
    each(l=>{if(l!=free&&Math.random()<.6)row[l]=low()});
  } else if(r<.3){
    each(l=>{if(l!=free)row[l]=Math.random()<Math.min(.5,sp/60)?'tm':'ts'});
    hasT=true;
  } else if(r<.55){
    each(l=>{if(Math.random()<.75)row[l]=low()});
  } else if(r<.72){
    each(l=>{if(l!=free&&Math.random()<.8)row[l]='gate'});
  } else if(r<.8&&G.t>20){
    tun=true;
  } else {
    row[(free+1)%3]='ts';row[(free+2)%3]=low();hasT=true;
  }
  if(tun){
    addObs('tunnel',1,z);
  } else {
    row.forEach((t,l)=>{if(t)addObs(t,l,z)});
  }
  /* --- FIXED: coin lane logic --- */
  let cl;
  if(tun){
    cl=free;
  } else {
    const freeLane=row.findIndex(x=>!x);
    cl=freeLane<0?free:freeLane;
  }
  const cy=(tun||row[cl])?1.9:1.1;
  for(let i=0;i<5;i++)addCoin(LANES[cl],cy+(cy>1.5?Math.sin(i/4*Math.PI)*.4:0),z-4+i*2);
  const ml=rnd(3),mz=z+G.gap/2;
  for(let i=0;i<6;i++)addCoin(LANES[ml],1.1,mz-6+i*2.4);
  if(Math.random()<.16){
    const ks=Object.keys(PU);
    addPick(ks[rnd(ks.length)],(ml+1+rnd(2))%3,mz);
  }
  G.gap=G.nz=Math.max(22,sp*1.05)+(hasT?12:0);
}

/* ---- Particles ---- */
function burst(x,y,z,col,n){
  if(!PS)return;
  PS.material.color.set(col);
  let k=0;
  for(let i=0;i<NP&&k<n;i++){
    if(pLife[i]<=0){
      pLife[i]=.6;
      pPos[i*3]=x;pPos[i*3+1]=y;pPos[i*3+2]=z;
      pVel[i*3]=(Math.random()-.5)*5;
      pVel[i*3+1]=Math.random()*5;
      pVel[i*3+2]=(Math.random()-.5)*5;
      k++;
    }
  }
}
function partUpd(dt){
  if(!PS)return;
  for(let i=0;i<NP;i++){
    if(pLife[i]>0){
      pLife[i]-=dt;
      pVel[i*3+1]-=9*dt;
      for(let j=0;j<3;j++)pPos[i*3+j]+=pVel[i*3+j]*dt;
      if(pLife[i]<=0)pPos[i*3+1]=-100;
    }
  }
  PS.geometry.attributes.position.needsUpdate=true;
}

/* ---- Flow ---- */
const dayNum=()=>Math.floor(Date.now()/864e5);
const lvl=()=>1+Math.floor(Math.sqrt(S.xp/40));
function checkReset(){
  const d=dayNum(),w=Math.floor(d/7);
  if(!S.mk||typeof S.mk!=='object')S.mk={d:0,w:0};
  if(S.mk.d!==d){
    MS.filter(m=>m.s==='d').forEach(m=>delete S.ms[m.id]);
    S.mk.d=d;
  }
  if(S.mk.w!==w){

    S.mk.w=w;
  }
}

function hit(){
  if(G.inv>0||pw.jet>0||pw.boost>0)return;
  if(pw.shd>0||pw.hov>0){
    if(pw.hov>0)pw.hov=0;else pw.shd=0;
    G.inv=1.5;
    burst(P.x,1,0,0x3b82f6,16);

  }

}
function activate(k){
  snd('pow');G.pows++;

  burst(P.x,1,0,PU[k][3],14);
}

/* ---- Main update ---- */
function play(dt){
  G.t+=dt;G.inv=Math.max(0,G.inv-dt);
  for(const k in pw){
    if(pw[k]>0){
      pw[k]-=dt;
      if(pw[k]<=0){
        pw[k]=0;
        if(k==='jet')G.inv=1.5;
        if(k==='boost')G.inv=1.0; /* FIX: boost khatam hote hi invincibility */
      }
    }
  }
  G.speed=Math.min(34,14+G.t*.22)*(pw.boost>0?1.5:1);
  const d=G.speed*dt;
  G.dist+=d;
  G.score+=d*2*(pw.x2>0?2:1);
  G.nz-=d;
  if(G.nz<=0)spawnRow();
  P.x+=(LANES[P.lane]-P.x)*Math.min(1,14*dt);
  if(pw.jet>0){
    P.y+=(4.5-P.y)*Math.min(1,4*dt);P.vy=0;P.sl=0;
  } else if(P.y>0||P.vy>0){
    P.vy-=34*dt;P.y+=P.vy*dt;
    if(P.y<=0){P.y=0;P.vy=0}
  }
  if(P.sl>0)P.sl-=dt;
  G.step-=dt;
  if(P.y<=.02&&G.step<=0&&pw.jet<=0){snd('step');G.step=Math.max(.18,.38-G.speed*.006)}
  G.fx-=dt;
  if(G.fx<=0){
    G.fx=.12;
    [['mag',0x19d3c5],['snk',0x4cd964],['x2',0xffb21a],['boost',0xffe066]].forEach(([k,c])=>{
      if(pw[k]>0)burst(P.x,k==='mag'?1:.2,0,c,2);
    });
    if(pw.jet>0)burst(P.x,P.y+.6,.4,0xff7a00,3);
  }
  const top=P.y+(P.sl>0?.75:1.7);
  if(G.inv<=0&&pw.jet<=0&&pw.boost<=0){
    for(const o of obs){
      if(o.decor||Math.abs(o.z)>o.len/2+.4||Math.abs(o.x-P.x)>o.hw+.32)continue;
      if(P.y<o.y1&&top>o.y0){hit();break}
    }
  }
  const px=P.x,py=P.y+.85;
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];
    if(pw.mag>0&&Math.abs(c.z)<12&&Math.abs(c.x-px)<9){
      const k=Math.min(1,10*dt);
      c.x+=(px-c.x)*k;c.z+=(0-c.z)*k;c.y+=(py-c.y)*k;
    }
    if(Math.abs(c.z)<.9&&Math.abs(c.x-px)<.9&&Math.abs(c.y-py)<1.1){
      G.coins++;G.score+=10*(pw.x2>0?2:1);
      scene.remove(c.m);coins.splice(i,1);
      if(T-lastCS>.05){snd('coin');lastCS=T}
      burst(c.x,c.y,0,0xffd400,3);
    }
  }
  for(let i=picks.length-1;i>=0;i--){
    const p=picks[i];
    if(Math.abs(p.z)<1.1&&Math.abs(p.x-px)<1.2&&(P.y<2.2||pw.jet>0)){
      activate(p.k);scene.remove(p.m);picks.splice(i,1);
    }
  }
  return d;
}
function hudUpd(){
  const s=Math.floor(G.score)+'',d=Math.floor(G.dist)+' m',c='🪙 '+G.coins;
  if($('#hS').textContent!==s)$('#hS').textContent=s;
  if($('#hD').textContent!==d)$('#hD').textContent=d;
  if($('#hC').textContent!==c)$('#hC').textContent=c;
  let h='';
  for(const k in pw){
    if(pw[k]>0)h+=`<span style="--c:#${PU[k][3].toString(16).padStart(6,'0')}">${PU[k][0]} ${Math.ceil(pw[k])}</span>`;
  }
  if($('#chips').innerHTML!==h)$('#chips').innerHTML=h;
  const m=MS.find(m=>m.s==='d'&&!((S.ms[m.id]||{}).c)&&((S.ms[m.id]||{}).p||0)<m.g);
  let t='';
  if(m){
    const e=S.ms[m.id]||{p:0};
    const cur=m.t==='coins'?G.coins:m.t==='dist'?G.dist:m.t==='score'?G.score:0;
    t=m.n+': '+Math.floor(m.t==='score'?Math.max(e.p,cur):e.p+cur)+' / '+m.g;
  }
  if($('#hM').textContent!==t)$('#hM').textContent=t;
}
function update(dt){
  T+=dt;
  if(state==='pause'||state==='boot')return;
  let d=0;
  if(state==='menu'){
    d=9*dt;menuT-=dt;
    if(menuT<=0){addObs('tm',0,-150,true);menuT=3+Math.random()*3}
  } else if(state==='play'){
    d=play(dt);
  }
  dayT+=d;
  const n=(Math.sin(dayT/900+1.57)+1)/2;
  const sky=new THREE.Color(0x070b25).lerp(new THREE.Color(0x6ec6ff),n);
  scene.background.copy(sky);scene.fog.color.copy(sky);
  sun.intensity=.2+.9*n;hemi.intensity=.35+.55*n;
  tiles.forEach(t=>{
    t.position.z+=d;
    if(t.position.z>26){t.position.z-=TL*NT;decorate(t)}
  });
  for(let i=obs.length-1;i>=0;i--){
    const o=obs[i];
    o.z+=d+o.vz*dt*(state==='over'?0:1);
    o.m.position.z=o.z;
    if(o.z>14||o.z<-190){scene.remove(o.m);obs.splice(i,1)}
  }
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];
    if(state!=='play')c.z+=d;
    else if(!(pw.mag>0&&Math.abs(c.z)<12))c.z+=d;
    c.m.position.set(c.x,c.y,c.z);
    c.m.rotation.y+=5*dt;
    if(c.z>12){scene.remove(c.m);coins.splice(i,1)}
  }
  for(let i=picks.length-1;i>=0;i--){
    const p=picks[i];
    p.z+=d;p.m.position.z=p.z;
    p.m.rotation.y+=3*dt;p.m.children[1].rotation.x+=2*dt;
    if(p.z>12){scene.remove(p.m);picks.splice(i,1)}
  }
  const menu=state==='menu',hov=pw.hov>0;
  P.g.position.set(P.x,P.y+(hov?.16:0),0);
  P.g.rotation.y+=((menu?-2.35:0)-P.g.rotation.y)*Math.min(1,5*dt);
  pose(P.c,T,state==='over'?'jump':(P.y>.05||pw.jet>0)?'jump':P.sl>0?'slide':'run');
  P.bm.visible=menu||hov;
  P.jp.visible=pw.jet>0;
  P.sh.visible=pw.shd>0;
  P.g.visible=!G||state!=='play'||G.inv<=0||Math.floor(T*20)%2===0;
  const po=innerWidth/innerHeight<.8;
  if(menu){
    camP.set(3.4,1.9,4.6);lkT.set(0,1.05,0);
  } else {
    const cx=P.x*.55*S.cam;
    camP.set(cx,(po?5.4:4.4)+P.y*.3,po?10.8:8.4);
    lkT.set(cx*.6,1.4+P.y*.2,-9);
  }
  const k=Math.min(1,5*dt);
  cam.position.lerp(camP,k);
  lk.lerp(lkT,k);
  cam.lookAt(lk);
  partUpd(dt);
  if(state==='play')hudUpd();
}

      BD.forEach((c,i)=>{
        const o=S.boards.includes(i);
        h+=`<div class="it"><i class="sw" style="background:linear-gradient(${c.c},${c.g})"></i><div style="flex:1"><b>${c.n}</b><br><small>Hoverboard skin</small></div>${o?`<button class="b sm${S.bd==i?' pri':''}" data-act="selb" data-i="${i}">${S.bd==i?'Selected':'Select'}</button>`:`<button class="b sm" data-act="buyb" data-i="${i}">🪙 ${c.p}</button>`}</div>`;
      });
    } else {
      h+=`<div class="it"><div style="flex:1"><b>Power-up duration</b><br><small>Level ${S.up}/5 · every level adds 15% time</small></div>${S.up>=5?'<small>Max</small>':`<button class="b sm" data-act="upg">🪙 ${200*(S.up+1)}</button>`}</div>`;
    }
    return H('Shop',h);
  },
  missions(){
    checkReset();
    let h=`<div class="coin">Level ${lvl()} · ${Math.floor(S.xp)} XP</div>`;
    [['d','Daily missions'],['w','Weekly challenges'],['a','Achievement badges']].forEach(([s,t])=>{
      h+=`<h3>${t}</h3>`;
      MS.filter(m=>m.s===s).forEach(m=>{
        const e=S.ms[m.id]||{p:0,c:0},p=Math.min(e.p,m.g),done=e.p>=m.g;
        h+=`<div class="it"><div style="flex:1"><b>${m.n}</b><div class="bar"><i style="width:${p/m.g*100}%"></i></div><small>${Math.floor(p)} / ${m.g}</small></div>${e.c?'<small>Claimed</small>':`<button class="b sm${done?' pri':''}" ${done?'':'disabled'} data-act="claim" data-i="${m.id}">🪙 ${m.r}</button>`}</div>`;
      });
    });
    return H('Missions',h);
  },
  daily(){
    const td=dayNum(),can=S.daily!==td;
    const cur=(can?(S.daily===td-1?S.streak:0):Math.max(0,S.streak-1))%7;
    let h=`<div class="coin">🪙 ${S.coins}</div><div class="days">`;
    DR.forEach((r,i)=>{
      h+=`<div class="dy${i==cur&&can?' t':''}${i<cur||(i==cur&&!can)?' d':''}">Day ${i+1}<br>🪙${r}${i<cur||(i==cur&&!can)?'<br>✓':''}</div>`;
    });
    h+=`</div><button class="b pri" style="width:100%" data-act="dclaim" ${can?'':'disabled'}>${can?'Claim 🪙 '+DR[cur]:'Come back tomorrow'}</button>`;
    return H('Daily reward',h);
  },
  ranks(){
    let h=S.scores.length?S.scores.map((x,i)=>`<div class="it"><b>#${i+1}</b><span style="flex:1">${x.c}</span><b>${x.s}</b></div>`).join(''):'<p>No runs yet. Play to set your first score.</p>';
    return H('Leaderboard',h+`<p><small>Top 5 runs on this device.</small></p>`);
  },
  settings(){
    const tg=(k,t)=>`<div class="it"><b style="flex:1">${t}</b><button class="b sm${S[k]?' pri':''}" data-act="tg" data-i="${k}">${S[k]?'On':'Off'}</button></div>`;
    const rg=(k,t,a,b,s)=>`<div class="it"><b style="width:130px">${t}</b><input type="range" min="${a}" max="${b}" step="${s}" value="${S[k]}" data-set="${k}" style="flex:1"></div>`;
    return H('Settings',
      tg('mu','Music')+tg('sf','Sound')+
      rg('mv','Music volume',0,1,.05)+rg('sv','Sound volume',0,1,.05)+
      `<div class="it"><b style="flex:1">Graphics</b>${['Low','Medium','High'].map((n,i)=>`<button class="b sm${S.q==i?' pri':''}" data-act="ql" data-i="${i}">${n}</button>`).join('')}</div>`+
      rg('cam','Camera sensitivity',.4,1.6,.1)+
      `<button class="b" style="width:100%" data-act="fs">Fullscreen</button><p><small>Swipe left or right to change lane, up to jump, down to slide. Keyboard: arrow keys or WASD, P or Esc to pause.</small></p>`
    );
  },
  pause(){
    return `<h2>Paused</h2><div class="nav"><button class="b pri" data-act="resume">Resume</button><button class="b" data-act="restart">Restart</button><button class="b" data-act="open" data-i="settings">Settings</button><button class="b" data-act="home">Home</button></div>`;
  },
  over(){
    const r=G.res;
    return `<h2>Crashed!</h2><div class="coin">${r.sc}${r.nb?' · New best!':''}</div><p>Best ${S.best} · ${r.ds} m · 🪙 ${r.coins}${r.bonus?' + '+r.bonus+' score bonus':''}</p><div class="nav"><button class="b pri" data-act="restart">Restart</button><button class="b" data-act="home">Home</button></div>`;
  }
};
function openPanel(n,tab){
  if(tab)shopTab=tab;
  if(n==='settings')from=curP;
  curP=n;
  $('#pb').innerHTML=PNL[n]();
  $('#panel').classList.add('on');
  showScr(false);
}
function act(a,i,t){
  switch(a){
    case'play':case'restart':startGame();break;
    case'open':openPanel(i,t);break;
    case'back':
      if(from==='pause'&&curP==='settings'){from='';openPanel('pause')}
      else{$('#panel').classList.remove('on');from='';showScr(true);refreshMenu()}
      break;
    case'tab':shopTab=i;openPanel('shop');break;
    case'selc':S.ch=+i;setChar();save();openPanel('shop');break;
    case'selb':S.bd=+i;setChar();save();openPanel('shop');break;
    case'buyc':
      if(S.coins>=CH[i].p){S.coins-=CH[i].p;S.chars.push(+i);S.ch=+i;setChar();save();snd('pow')}
      else toast('Not enough coins');
      openPanel('shop');break;
    case'buyb':
      if(S.coins>=BD[i].p){S.coins-=BD[i].p;S.boards.push(+i);S.bd=+i;setChar();save();snd('pow')}
      else toast('Not enough coins');
      openPanel('shop');break;
    case'upg':{
      const c=200*(S.up+1);
      if(S.up<5&&S.coins>=c){S.coins-=c;S.up++;save();snd('pow')}
      else toast('Not enough coins');
      openPanel('shop');
    }break;
    case'claim':{
      const m=MS.find(m=>m.id===i),e=S.ms[i];
      if(m&&e&&e.p>=m.g&&!e.c){e.c=1;S.coins+=m.r;S.xp+=m.r/2;save();snd('pow')}
      openPanel('missions');
    }break;
    case'dclaim':{
      const td=dayNum();
      if(S.daily!==td){
        S.streak=S.daily===td-1?S.streak+1:1;
        S.daily=td;
        S.coins+=DR[(S.streak-1)%7];
        save();snd('pow');
      }
      openPanel('daily');
    }break;
    case'tg':S[i]=S[i]?0:1;applyVol();save();openPanel('settings');break;
    case'ql':S.q=+i;applyQ();save();openPanel('settings');break;
    case'fs':{
      const e=document.documentElement,f=e.requestFullscreen||e.webkitRequestFullscreen;
      try{document.fullscreenElement?document.exitFullscreen():f&&f.call(e)}catch(x){}
    }break;
    case'pause':pauseGame();break;
    case'resume':resume();break;
    case'home':home();break;
  }
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b)return;
  initAudio();
  snd('click');
  act(b.dataset.act,b.dataset.i,b.dataset.t);
});
document.addEventListener('input',e=>{
  const k=e.target.dataset.set;
  if(!k)return;
  S[k]=+e.target.value;applyVol();save();
});
function applyQ(){
  if(!R||!scene||!sun)return;
  const q=S.q;
  R.setPixelRatio(Math.min(devicePixelRatio||1,[1,1.5,2][q]));
  sun.castShadow=q===2;
  scene.fog.far=[80,110,140][q];
  resize();
  scene.traverse(o=>{if(o.material)o.material.needsUpdate=true});
}
function resize(){
  if(!R||!cam)return;
  R.setSize(innerWidth,innerHeight,false);
  cam.aspect=innerWidth/innerHeight;
  cam.fov=cam.aspect<.8?70:60;
  cam.updateProjectionMatrix();
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,200));

/* ---- Boot ---- */
let last=0;
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(t-last)/1000||0);
  last=t;
  try{update(dt);R.render(scene,cam)}catch(e){console.error(e)}
}
function boot(){
  try{
    if(typeof THREE==='undefined')throw new Error('Three.js could not be loaded. Check your internet connection.');
    checkReset();
    init3D();
    cam.position.set(3.4,1.9,4.6);
    lk.set(0,1.05,0);
    Object.keys(PU).forEach(k=>pw[k]=0);
    state='menu';
    showScr(true);refreshMenu();
    $('#load').classList.remove('on');
    requestAnimationFrame(loop);
  }catch(e){
    $('#lt').innerHTML=e.message+'<br><br><button class="b pri" onclick="location.reload()">Retry</button>';
  }
}
window.addEventListener('load',boot);
</script></body></html>
