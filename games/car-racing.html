<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Endless Car Racing - Play Free Online | GameZone 203</title>

<!-- SEO TAGS -->
<meta name="description" content="Play Endless Car Racing free online at GameZone 203. Dodge traffic, earn coins, unlock new cars, and beat your high score!">
<link rel="canonical" href="https://shakeeljee254-oss.github.io/gamezone-203/games/car-racing.html">
<meta property="og:title" content="Endless Car Racing - Play Free Online | GameZone 203">
<meta property="og:image" content="https://shakeeljee254-oss.github.io/gamezone-203/cover.png">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap');

  body {
    margin: 0;
    overflow: hidden;
    background: radial-gradient(circle at center, #1e293b, #0f172a);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Poppins', sans-serif;
    touch-action: none;
    color: white;
  }
  canvas {
    background: #1e293b;
    box-shadow: 0 0 40px rgba(56, 189, 248, 0.2);
    border-radius: 15px;
    border: 2px solid #334155;
    max-width: 100%;
    max-height: 100vh;
  }
  
  /* Menu Overlay */
  #menuOverlay {
    position: absolute;
    background: rgba(15, 23, 42, 0.95);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    z-index: 10;
    border: 2px solid #38bdf8;
    box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
    width: 90%;
    max-width: 400px;
  }
  h1 { color: #38bdf8; margin-top: 0; text-transform: uppercase; letter-spacing: 2px; font-weight: 900;}
  
  .garage {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 20px 0;
  }
  .car-card {
    background: #1e293b;
    padding: 15px;
    border-radius: 12px;
    border: 2px solid #334155;
    cursor: pointer;
    transition: 0.3s;
    width: 90px;
  }
  .car-card:hover { transform: scale(1.05); }
  .car-card.selected { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); background: #0f172a;}
  .car-card.locked { opacity: 0.5; cursor: not-allowed; }
  
  .car-icon { font-size: 30px; margin-bottom: 5px; }
  .car-name { font-size: 12px; font-weight: bold; }
  .car-price { font-size: 12px; color: #fbbf24; font-weight: bold; margin-top: 5px; }
  
  #totalCoins {
    font-size: 20px;
    color: #fbbf24;
    font-weight: bold;
    margin-bottom: 20px;
    text-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
  }
  
  button.play-btn {
    background: linear-gradient(90deg, #38bdf8, #3b82f6);
    color: #0f172a;
    border: none;
    padding: 15px 40px;
    font-size: 20px;
    font-weight: 900;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
    width: 100%;
    text-transform: uppercase;
  }
  button.play-btn:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(56, 189, 248, 0.6); }
</style>
</head>
<body>

  <!-- Garage Menu -->
  <div id="menuOverlay">
    <h1>Garage</h1>
    <div id="totalCoins">🪙 Coins: 0</div>
    
    <div class="garage" id="garage">
      <!-- Cars will be generated here -->
    </div>
    
    <p id="msgBox" style="color: #ef4444; font-size: 12px; height: 15px; margin: 0 0 10px 0;"></p>
    
    <button class="play-btn" onclick="startGame()">START RACE</button>
  </div>

  <canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const menuOverlay = document.getElementById("menuOverlay");
  const garageEl = document.getElementById("garage");
  const totalCoinsEl = document.getElementById("totalCoins");
  const msgBox = document.getElementById("msgBox");

  let gameRunning = false;
  let score = 0;
  let level = 1;
  let speed = 5;
  let roadOffset = 0;
  let distance = 0;
  let spawnTimer = 0;

  // Coins & Cars State
  let coins = parseInt(localStorage.getItem("racingCoins")) || 0;
  let unlockedCars = JSON.parse(localStorage.getItem("racingCars")) || [0]; // 0 index unlocked by default
  let selectedCar = parseInt(localStorage.getItem("racingSelectedCar")) || 0;

  const carsDB = [
    { name: "Starter", color: "#38bdf8", price: 0, icon: "🚗" },
    { name: "Sport", color: "#ef4444", price: 100, icon: "🏎️" },
    { name: "Super", color: "#a855f7", price: 300, icon: "🚓" }
  ];

  const playerCar = {
    x: canvas.width / 2 - 20,
    y: canvas.height - 120,
    width: 40,
    height: 80,
  };

  let opponents = [];
  const opponentColors = ["#fbbf24", "#10b981", "#f97316"];
  const lanes = [canvas.width / 4 - 20, canvas.width / 2 - 20, (3 * canvas.width) / 4 - 20];

  // Initialize Menu
  function initMenu() {
    totalCoinsEl.textContent = `🪙 Coins: ${coins}`;
    garageEl.innerHTML = "";
    
    carsDB.forEach((car, index) => {
      const isUnlocked = unlockedCars.includes(index);
      const isSelected = selectedCar === index;
      
      const card = document.createElement("div");
      card.className = `car-card ${isSelected ? 'selected' : ''} ${!isUnlocked ? 'locked' : ''}`;
      
      card.innerHTML = `
        <div class="car-icon">${car.icon}</div>
        <div class="car-name">${car.name}</div>
        ${!isUnlocked ? `<div class="car-price">🪙 ${car.price}</div>` : ''}
      `;
      
      card.onclick = () => handleCarClick(index);
      garageEl.appendChild(card);
    });
  }

  function handleCarClick(index) {
    const isUnlocked = unlockedCars.includes(index);
    
    if (isUnlocked) {
      selectedCar = index;
      localStorage.setItem("racingSelectedCar", selectedCar);
      msgBox.textContent = "";
      initMenu();
    } else {
      // Try to buy
      const price = carsDB[index].price;
      if (coins >= price) {
        coins -= price;
        localStorage.setItem("racingCoins", coins);
        unlockedCars.push(index);
        localStorage.setItem("racingCars", JSON.stringify(unlockedCars));
        selectedCar = index;
        localStorage.setItem("racingSelectedCar", selectedCar);
        msgBox.style.color = "#10b981";
        msgBox.textContent = `Successfully unlocked ${carsDB[index].name}!`;
        initMenu();
      } else {
        msgBox.style.color = "#ef4444";
        msgBox.textContent = `Not enough coins! You need ${price - coins} more.`;
      }
    }
  }

  function startGame() {
    menuOverlay.style.display = "none";
    gameRunning = true;
    score = 0;
    level = 1;
    speed = 5;
    distance = 0;
    spawnTimer = 0;
    opponents = [];
    playerCar.x = canvas.width / 2 - 20;
    roadOffset = 0;
    gameLoop();
  }

  function spawnCar() {
    const lane = lanes[Math.floor(Math.random() * lanes.length)];
    if (opponents.some(car => car.y < 200 && car.x === lane)) return;

    opponents.push({
      x: lane, y: -100, width: 40, height: 80,
      color: opponentColors[Math.floor(Math.random() * opponentColors.length)]
    });
  }

  function drawCar(x, y, width, height, color) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.roundRect(x, y, width, height, 10); ctx.fill();
    
    // Windows
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.beginPath(); ctx.roundRect(x + 5, y + 10, width - 10, 20, 5); ctx.fill();
    ctx.beginPath(); ctx.roundRect(x + 5, y + 35, width - 10, 20, 5); ctx.fill();

    // Lights
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.fillRect(x + 5, y, 8, 4);
    ctx.fillRect(x + width - 13, y, 8, 4);

    // Wheels
    ctx.fillStyle = "black";
    ctx.fillRect(x - 4, y + 10, 6, 15);
    ctx.fillRect(x + width - 2, y + 10, 6, 15);
    ctx.fillRect(x - 4, y + height - 25, 6, 15);
    ctx.fillRect(x + width - 2, y + height - 25, 6, 15);
  }

  function drawRoad() {
    // Dark Road
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(50, 0, canvas.width - 100, canvas.height);

    // Grass / Sidewalks
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, 0, 50, canvas.height);
    ctx.fillRect(canvas.width - 50, 0, 50, canvas.height);

    // Road Lines
    ctx.fillStyle = "#475569";
    roadOffset = (roadOffset + speed) % 40;
    for (let y = -40; y < canvas.height; y += 40) {
      ctx.fillRect(canvas.width / 2 - 4, y + roadOffset, 8, 20);
    }
    
    // Edge Lines
    ctx.fillStyle = "#38bdf8";
    ctx.fillRect(50, 0, 4, canvas.height);
    ctx.fillRect(canvas.width - 54, 0, 4, canvas.height);
  }

  function update() {
    if (!gameRunning) return;

    // Difficulty & Speed
    distance += speed;
    let newLevel = Math.floor(distance / 1000) + 1;
    if (newLevel > level) {
      level = newLevel;
      speed += 1; // Speed up each level
    }

    // Move Opponents
    for (let i = opponents.length - 1; i >= 0; i--) {
      let car = opponents[i];
      car.y += speed;

      // Collision
      if (
        playerCar.x < car.x + car.width - 5 &&
        playerCar.x + playerCar.width > car.x + 5 &&
        playerCar.y < car.y + car.height - 5 &&
        playerCar.y + playerCar.height > car.y + 5
      ) {
        gameOver();
        return;
      }

      if (car.y > canvas.height) {
        opponents.splice(i, 1);
        score += 10;
        coins += 1; // Earn 1 coin per car dodged
        localStorage.setItem("racingCoins", coins);
      }
    }

    // Spawning logic
    spawnTimer++;
    if (spawnTimer > Math.max(30, 80 - (level * 5))) {
      spawnCar();
      spawnTimer = 0;
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawRoad();

    opponents.forEach(car => drawCar(car.x, car.y, car.width, car.height, car.color));
    drawCar(playerCar.x, playerCar.y, playerCar.width, playerCar.height, carsDB[selectedCar].color);

    // UI
    ctx.fillStyle = "white";
    ctx.font = "bold 18px Poppins";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 15, 30);
    ctx.fillText("Level: " + level, 15, 55);
    
    ctx.fillStyle = "#fbbf24";
    ctx.textAlign = "right";
    ctx.fillText("🪙 " + coins, canvas.width - 15, 30);
  }

  function gameOver() {
    gameRunning = false;
    
    setTimeout(() => {
      ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
      ctx.fillRect(0, canvas.height/2 - 120, canvas.width, 240);
      
      ctx.fillStyle = "#ef4444";
      ctx.font = "900 32px Poppins";
      ctx.textAlign = "center";
      ctx.fillText("CRASHED!", canvas.width/2, canvas.height/2 - 50);
      
      ctx.fillStyle = "white";
      ctx.font = "bold 18px Poppins";
      ctx.fillText(`Score: ${score} | Level: ${level}`, canvas.width/2, canvas.height/2);
      
      ctx.fillStyle = "#fbbf24";
      ctx.fillText(`Coins Earned: +${Math.floor(score/10)}`, canvas.width/2, canvas.height/2 + 30);
      
      ctx.fillStyle = "#38bdf8";
      ctx.font = "14px Poppins";
      ctx.fillText("Click to return to Garage", canvas.width/2, canvas.height/2 + 80);
      
      const backToMenu = () => {
        canvas.removeEventListener("mousedown", backToMenu);
        canvas.removeEventListener("touchstart", backToMenu);
        menuOverlay.style.display = "block";
        initMenu();
      };
      canvas.addEventListener("mousedown", backToMenu);
      canvas.addEventListener("touchstart", backToMenu, {passive: true});
      
    }, 100);
  }

  function gameLoop() {
    if (!gameRunning) return;
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  // Controls
  window.addEventListener("keydown", (e) => {
    if (!gameRunning) return;
    if (e.key === "ArrowLeft" || e.key === "a") {
      playerCar.x = lanes[0];
    } else if (e.key === "ArrowRight" || e.key === "d") {
      playerCar.x = lanes[2];
    } else if (e.key === "ArrowUp" || e.key === "w") {
      playerCar.x = lanes[1];
    }
  });

  let touchStartX = 0;
  canvas.addEventListener("touchstart", (e) => {
    if (!gameRunning) return;
    touchStartX = e.touches[0].clientX;
  }, {passive: true});

  canvas.addEventListener("touchend", (e) => {
    if (!gameRunning) return;
    let touchEndX = e.changedTouches[0].clientX;
    if (touchEndX < touchStartX - 30) {
      if (playerCar.x === lanes[2]) playerCar.x = lanes[1];
      else if (playerCar.x === lanes[1]) playerCar.x = lanes[0];
    } else if (touchEndX > touchStartX + 30) {
      if (playerCar.x === lanes[0]) playerCar.x = lanes[1];
      else if (playerCar.x === lanes[1]) playerCar.x = lanes[2];
    }
  }, {passive: true});

  canvas.addEventListener("mousedown", (e) => {
    if (!gameRunning) return;
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    if (mouseX < canvas.width / 2) {
      if (playerCar.x === lanes[2]) playerCar.x = lanes[1];
      else if (playerCar.x === lanes[1]) playerCar.x = lanes[0];
    } else {
      if (playerCar.x === lanes[0]) playerCar.x = lanes[1];
      else if (playerCar.x === lanes[1]) playerCar.x = lanes[2];
    }
  });

  // Init on Load
  initMenu();

</script>
</body>
</html>
