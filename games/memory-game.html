<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match - Play Free Online | GameZone 203</title>
<style>
:root { --bg: #1a1a2e; --card: #16213e; --accent: #e94560; }
body { margin: 0; background: var(--bg); color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; justify-content: center; }
h1 { color: var(--accent); margin-bottom: 10px; }
p { color: #aab1ce; margin-top: 0; margin-bottom: 20px; }
.game-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 400px; width: 90%; margin-bottom: 20px; }
.card { aspect-ratio: 1; background: var(--card); border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 40px; position: relative; transition: 0.3s; transform-style: preserve-3d; }
.card.flipped { background: #0f3460; transform: rotateY(180deg); }
.card.matched { background: #2ecc71; cursor: default; pointer-events: none; }
.card span { display: none; transform: rotateY(180deg); }
.card.flipped span, .card.matched span { display: block; }
.stats { display: flex; gap: 20px; font-size: 18px; margin-bottom: 20px; font-weight: bold; }
button { background: var(--accent); color: white; border: 0; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
button:hover { background: #c0354d; }
</style>
</head>
<body>
<h1>Memory Match</h1>
<p>Find all the matching pairs!</p>
<div class="stats">
 <div>Moves: <span id="moves">0</span></div>
 <div>Time: <span id="time">0s</span></div>
</div>
<div class="game-board" id="board"></div>
<button onclick="startGame()">New Game</button>
<script>
const emojis = ["🍎", "🍌", "🍇", "🍓", "🍒", "🍉", "🥥", "🍍"];
let cards = [], flipped = [], matched = 0, moves = 0, time = 0, timer, isLocked = false;
function startGame() {
 const board = document.getElementById("board");
 board.innerHTML = "";
 cards = [...emojis, ...emojis].sort(() => Math.random() - 0.5);
 flipped = []; matched = 0; moves = 0; time = 0; isLocked = false;
 document.getElementById("moves").textContent = moves;
 document.getElementById("time").textContent = "0s";
 clearInterval(timer);
 timer = setInterval(() => { time++; document.getElementById("time").textContent = time + "s"; }, 1000);
 cards.forEach((emoji, index) => {
  const card = document.createElement("div");
  card.classList.add("card");
  card.dataset.emoji = emoji;
  card.innerHTML = `<span>${emoji}</span>`;
  card.addEventListener("click", flipCard);
  board.appendChild(card);
 });
}
function flipCard() {
 if (isLocked || this.classList.contains("flipped") || this.classList.contains("matched")) return;
 this.classList.add("flipped");
 flipped.push(this);
 if (flipped.length === 2) {
  moves++;
  document.getElementById("moves").textContent = moves;
  checkMatch();
 }
}
function checkMatch() {
 isLocked = true;
 const [card1, card2] = flipped;
 if (card1.dataset.emoji === card2.dataset.emoji) {
  card1.classList.add("matched"); card2.classList.add("matched");
  matched++; flipped = []; isLocked = false;
  if (matched === emojis.length) {
   clearInterval(timer);
   setTimeout(() => alert(`You won in ${moves} moves and ${time} seconds!`), 500);
  }
 } else {
  setTimeout(() => {
   card1.classList.remove("flipped"); card2.classList.remove("flipped");
   flipped = []; isLocked = false;
  }, 800);
 }
}
startGame();
</script>
</body>
</html>
