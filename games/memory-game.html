<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Slither.io - Play Free Online | GameZone 203</title>

<!-- SEO TAGS -->
<meta name="description" content="Play Slither.io style game free online at GameZone 203. Compete against AI snakes, eat food, and become the biggest!">
<link rel="canonical" href="https://shakeeljee254-oss.github.io/gamezone-203/games/neon-snake/slither.html">

<meta property="og:image" content="https://shakeeljee254-oss.github.io/gamezone-203/cover.png">

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;background:#0d1a0d;color:white;
 font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
 display:flex;justify-content:center;align-items:center;
 overflow:hidden;
}
.game-container { width: 100vw; height: 100vh; position: relative; }
canvas { display: block; width: 100%; height: 100%; touch-action:none; }

.ui-panel { position: absolute; top: 15px; left: 15px; pointer-events: none; }
.score-board { font-size: 20px; font-weight: bold; color: #fff; text-shadow: 0 0 10px #50f5d0; }
.leaderboard { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 8px; font-size: 14px; pointer-events: none; border: 1px solid #333; }
.leaderboard h3 { margin: 0 0 8px 0; color: #f1c40f; text-align: center; font-size: 14px; }
.leaderboard div { margin-bottom: 4px; display: flex; justify-content: space-between; gap: 15px; }

.overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
.overlay h1 { color: #50f5d0; font-size: 40px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; text-align: center;}
.overlay p { color: #aaa; margin-bottom: 20px; font-size: 16px; text-align: center; max-width: 80%;}
button { background:linear-gradient(90deg,#50f5d0,#00a8ff); color:#000; border:0; padding:15px 40px; border-radius:30px; font-weight:bold; font-size:18px; cursor:pointer; transition: transform 0.1s; text-transform: uppercase; }
button:hover { transform: scale(1.05); }
button:active { transform:scale(.95); }
.hidden { display: none !important; }
</style>
</head>
<body>

<div class="game-container">
 <canvas id="game"></canvas>
 
 <div class="ui-panel">
  <div class="score-board">Length: <span id="score">10</span></div>
 </div>

 <div class="leaderboard">
  <h3>🏆 Leaderboard</h3>
  <div id="leader-list"></div>
 </div>

 <div class="overlay" id="startScreen">
  <h1>Slither Arena</h1>
  <p>Eat food to grow. Don't let others hit your body, and try to make them crash into you!</p>
  <button id="startBtn">Play Now</button>
 </div>

 <div class="overlay hidden" id="gameOverScreen">
  <h1 style="color:#ff4d79">Game Over</h1>
  <p>You crashed! Final Length: <span id="finalScore">10</span></p>
  <button id="restartBtn">Play Again</button>
 </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let width, height;

function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOverScreen");
const scoreEl = document.getElementById("score");
const finalScoreEl = document.getElementById("finalScore");
const leaderList = document.getElementById("leader-list");

let player, ais, foods, playing, gameLoop;
let mouseX = 0, mouseY = 0;
const SPEED = 3.5;
const BASE_RADIUS = 10;

const AI_COLORS = ["#ff4d79", "#f1c40f", "#a855f7", "#00a8ff", "#e67e22"];

function createSnake(x, y, isPlayer) {
 return {
  x, y, dx: SPEED, dy: 0, isPlayer,
  body: [{x, y}, {x: x-10, y}, {x: x-20, y}],
  color: isPlayer ? "#50f5d0" : AI_COLORS[Math.floor(Math.random() * AI_COLORS.length)],
  dead: false, score: 10, angle: 0
 };
}

function reset() {
 player = createSnake(width/2, height/2, true);
 ais = [];
 for(let i=0; i<3; i++) {
  let rx = Math.random() * width;
  let ry = Math.random() * height;
  // Spawn door rakhein taake shuru me hi takra na jayein
  if (Math.hypot(rx - player.x, ry - player.y) < 300) { rx += 400; ry += 400; }
  ais.push(createSnake(rx, ry, false));
 }
 
 foods = [];
 for(let i=0; i<80; i++) spawnFood();
 
 playing = false;
 updateUI();
 draw();
}

function spawnFood() {
 foods.push({
  x: Math.random() * width, y: Math.random() * height,
  color: `hsl(${Math.random() * 360}, 100%, 65%)`,
  radius: 5
 });
}

function startGame() {
 startScreen.classList.add("hidden");
 gameOverScreen.classList.add("hidden");
 reset();
 playing = true;
 
 window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
 canvas.addEventListener('touchmove', (e) => { 
  const rect = canvas.getBoundingClientRect();
  mouseX = e.touches[0].clientX - rect.left; 
  mouseY = e.touches[0].clientY - rect.top; 
 }, {passive: true});

 gameLoop = setInterval(update, 1000/60);
}

function drawSnake(snake) {
 if(snake.dead) return;
 
 const radius = BASE_RADIUS + (snake.score * 0.02); // Mota hone ka logic

 // Body draw karein peeche se aage
 for(let i = snake.body.length - 1; i >= 0; i--) {
  const seg = snake.body[i];
  ctx.beginPath();
  ctx.arc(seg.x, seg.y, radius, 0, Math.PI * 2);
  ctx.fillStyle = i === 0 ? "#ffffff" : snake.color; // Head white
  ctx.fill();
  
  // Glow effect
  ctx.shadowBlur = i === 0 ? 15 : 0;
  ctx.shadowColor = snake.color;
  ctx.stroke();
  ctx.shadowBlur = 0;
 }
}

function draw() {
 ctx.fillStyle = "#0d1a0d";
 ctx.fillRect(0, 0, width, height);

 // Draw foods
 foods.forEach(f => {
  ctx.beginPath(); ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
  ctx.fillStyle = f.color; ctx.fill();
 });

 // Draw AI Snakes
 ais.forEach(ai => drawSnake(ai));
 // Draw Player
 drawSnake(player);
}

function update() {
 if(!playing) return;

 // --- PLAYER MOVEMENT ---
 const angle = Math.atan2(mouseY - player.body[0].y, mouseX - player.body[0].x);
 player.dx += (Math.cos(angle) * SPEED - player.dx) * 0.15;
 player.dy += (Math.sin(angle) * SPEED - player.dy) * 0.15;
 moveSnake(player);
 
 // --- AI MOVEMENT ---
 ais.forEach(ai => {
  if(ai.dead) return;
  
  // AI ko sabse qareeb khana dhoondein
  let closestFood = null, minDist = Infinity;
  foods.forEach(f => {
   let d = Math.hypot(ai.body[0].x - f.x, ai.body[0].y - f.y);
   if(d < minDist) { minDist = d; closestFood = f; }
  });
  
  if(closestFood) {
   const aiAngle = Math.atan2(closestFood.y - ai.body[0].y, closestFood.x - ai.body[0].x);
   ai.dx += (Math.cos(aiAngle) * SPEED - ai.dx) * 0.05;
   ai.dy += (Math.sin(aiAngle) * SPEED - ai.dy) * 0.05;
  }
  
  // Deewar se bachne ka logic
  const margin = 100;
  if(ai.body[0].x < margin) ai.dx += 0.5;
  if(ai.body[0].x > width - margin) ai.dx -= 0.5;
  if(ai.body[0].y < margin) ai.dy += 0.5;
  if(ai.body[0].y > height - margin) ai.dy -= 0.5;
  
  moveSnake(ai);
 });

 checkCollisions();
 checkFoods();
 updateUI();
 draw();
}

function moveSnake(snake) {
 const head = snake.body[0];
 let nx = head.x + snake.dx;
 let ny = head.y + snake.dy;

 // Wrap around walls
 if(nx < 0) nx = width; if(nx > width) nx = 0;
 if(ny < 0) ny = height; if(ny > height) ny = 0;

 const newHead = {x: nx, y: ny};
 snake.body.unshift(newHead);
 
 // Tail pop karein agar lamba ho gaya
 if(snake.body.length > snake.score) {
  snake.body.pop();
 }
}

function checkFoods() {
 const allSnakes = [player, ...ais].filter(s => !s.dead);
 
 allSnakes.forEach(snake => {
  const head = snake.body[0];
  for(let i = foods.length - 1; i >= 0; i--) {
   const f = foods[i];
   if(Math.hypot(head.x - f.x, head.y - f.y) < BASE_RADIUS + (snake.score * 0.02) + f.radius) {
    foods.splice(i, 1);
    snake.score += 2; // Khane se lamba hota hai
    spawnFood();
    break;
   }
  }
 });
}

function checkCollisions() {
 const allSnakes = [player, ...ais].filter(s => !s.dead);
 const radius = BASE_RADIUS; // Thoda aasan collision check

 allSnakes.forEach(snake => {
  const head = snake.body[0];
  
  // Khud se takrana (ignore first 10 segments)
  for(let i = 10; i < snake.body.length; i++) {
   if(Math.hypot(head.x - snake.body[i].x, head.y - snake.body[i].y) < radius * 1.5) {
    killSnake(snake);
    return;
   }
  }

  // Doosre saanpon se takrana
  allSnakes.forEach(other => {
   if(snake === other || other.dead) return;
   for(let i = 0; i < other.body.length; i++) {
    // Agar head kisi aur ki body ke qareeb aya
    if(Math.hypot(head.x - other.body[i].x, head.y - other.body[i].y) < radius * 1.5) {
     killSnake(snake);
     other.score += Math.floor(snake.score / 2); // Jeetne wale ko aadha score milta hai
     return;
    }
   }
  });
 });
}

function killSnake(snake) {
 if(snake.dead) return;
 snake.dead = true;
 
 // Jo saanp mara uski body ka khana gir jaye
 snake.body.forEach(seg => {
  for(let i=0; i<2; i++) {
   foods.push({
    x: seg.x + (Math.random()-0.5)*20,
    y: seg.y + (Math.random()-0.5)*20,
    color: snake.color,
    radius: 5
   });
  }
 });

 if(snake.isPlayer) {
  playing = false;
  clearInterval(gameLoop);
  finalScoreEl.textContent = snake.score;
  gameOverScreen.classList.remove("hidden");
 }
}

function updateUI() {
 scoreEl.textContent = player.score;
 
 // Leaderboard
 const allSnakes = [player, ...ais].filter(s => !s.dead);
 allSnakes.sort((a, b) => b.score - a.score);
 
 leaderList.innerHTML = allSnakes.map((s, i) => {
  const name = s.isPlayer ? "You" : "AI Snake";
  const color = s.isPlayer ? "#50f5d0" : s.color;
  return `<div style="color:${color}"><span>${i+1}. ${name}</span> <span>${s.score}</span></div>`;
 }).join('');
}

document.getElementById("startBtn").onclick = startGame;
document.getElementById("restartBtn").onclick = startGame;

// Init
reset();
</script>
</body>
</html>
